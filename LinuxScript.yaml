        ErrorAndLog:  #ref: ${GitHub}/MyPrivateCode/ansible_vagrant/single_vm_ansible/others.sh#function  ErrorAndLog
        ErrorCount:  #keyword: ErrorCount,  bash 計算,  Linux インクリメント 加算
            基本:
                command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                #// TestError 関数 でも同様の処理を行います
            継続する場合: |
                ErrorCount=0
                command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                echo  "ErrorCount = ${ErrorCount}"  #// または EchoEndOfMain または EndOfTest または EchoEndOfTest
            スキップする場合: |  #focus: ErrorCount
                ErrorCount=0
                local  previousErrorCount=${ErrorCount}

                command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                if [ "${ErrorCount}" == "${previousErrorCount}" ]; then
                    command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                fi
                if [ "${ErrorCount}" == "${previousErrorCount}" ]; then
                    command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                fi

                previousErrorCount="${ErrorCount}"   #// 再開
                command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                if [ "${ErrorCount}" == "${previousErrorCount}" ]; then
                    command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                fi
                if [ "${ErrorCount}" == "${previousErrorCount}" ]; then
                    command  ||  ErrorCount=$(( ${ErrorCount} + 1 ))
                fi
                echo  "ErrorCount = ${ErrorCount}"
