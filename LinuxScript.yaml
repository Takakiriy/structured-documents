            CSV: #keyword: bash CSV
                簡易 strict CSV 版: #keyword: bash strict CSV
                    #search: strict CSV
                    #// 以下はコンマを値に含めることができない簡易版です。
                    #// 機械的にコンマで区切ります。空白や改行やダブルクォーテーションを含めることもできます。改行でレコードを分けない単一レコードです
                    サンプル: "Value1,Value2,Value3"
                    書式:
                        - コンマの前後、文字列全体の先頭、末尾に空白を含めることができません
                        - 値を " " などで囲むことができません
                        - 文字列全体の先頭、末尾は、コンマではありません。有無判定を行うときに一時的に付けます
                    （関連）: #search: bash 2D array
                    追加:
                        local  csv=""
                        csv="${csv}__Value1__,"
                        csv="${csv}__Value2__,"
                        csv="${csv%,*}"   #// left of last ","
                        #// "__Value1__,__Value2__"
                    有無判定:  #keyword: strict CSV item match
                        在るなら true:
                            if [[ ",${strictCSV}," == *",__Item__,"* ]]; then  #// strict CSV item match
                            #// [ ] では動作しません。[[ ]] を使ってください
                        無いなら true:
                            if [[ ",${strictCSV}," != *",__Item__,"* ]]; then  #// strict CSV item NOT match
                            #// [ ] では動作しません。[[ ]] を使ってください
                    最初の要素, 最後の要素: |  #search: Linux bash string left of right
                        echo "${csv%%,*}"  #// left of ","
                        echo "${csv##*,}"  #// right of last ","
                    GetStrictCSV: | #keyword:  #// , の前または後に空白がある CSV を strict CSV に変換します
                        function  GetStrictCSV() {
                            #// This version does not support comma-containing values
                            local  csv="$1"
                            echo "${csv}" | sed 's/ *, */,/g'  #// Cut spaces around comma
                        }
                    GetStrictCSVFromArray: | #keyword:
                        function  GetStrictCSVFromArray() {
                            #// Example:  local  csv="$( GetStrictCSVFromArray "${array[@]}" )"
                            (
                                IFS=,
                                printf '%s' "$*"
                            )
                        }
                    EchoFromStrictCSV: #keyword: EchoFromStrictCSV, GetInitialSpacedCSV  #// strict CSV から , の右に空白がある CSV に変換します
                        echo  "$input" | sed 's/,/, /g'
                簡易配列版:
                    #// 要素にコンマを含めることはできません
                    CSV → 配列:
                        local  array=( $( echo ${csv}  |  sed 's/,/ /g' ) )
                        #// csv の値に含まれるコンマの後に空白を入れても配列の内容は変わりません
                        #// ダブル クオーテーション はカットされません
                    配列 → Strict CSV:
                        local  array( "a" "b" "c" )
