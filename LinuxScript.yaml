                    _Dbg_DEBUGGER_LEVEL 環境変数: 空でなければ、デバッガーに接続しています
                関連 >> set -x:
                関連 >> pp: |  #keyword: bashlib pp,  pp  #// デバッグ用表示。複数行の値も表示できます
                    #section: Debug

                    function  pp() {
                        #// pp
                        #//     Debug print
                        #// Example:
                        #//     pp "$config"
                        #//     pp "$config" config
                        #//     pp "$array" array  ${#array[@]}  "${array[@]}"
                        #//     pp "123"
                        #//     $( pp "$config" >&2 )
                        local  value="${1-""}"  #// "${1-""}" means that "$1" default is "".
                        local  variableName="${2-""}"  #// "${1-""}" means that "$1" default is "".
                        local  oldIFS="$IFS"
                        IFS=$'\n'
                        local  valueLines=( ${value} )
                        IFS="$oldIFS"

                        local  type=""
                        if [ "${variableName}" != "" ]; then
                            if [[ "$(declare -p ${variableName} 2>&1 )" =~ "declare -a" ]]; then
                                local  type="array"
                            elif [[ "$(declare -p ${variableName} 2>&1 )" =~ "declare -n" ]]; then
                                local  type="nameref"  #// array or string
                            fi
                        fi
                        if [ "${type}" == "" ]; then
                            if [ "${#valueLines[@]}" == 1 ] || [ "${#valueLines[@]}" == 0 ]; then
                                local  type="oneLine"
                            else
                                local  type="multiLine"
                            fi
                        fi
                        if declare -f GetCodePosition > /dev/null 2>&1; then
                            local  position=" $( GetCodePosition 1 ) "
                        else
                            local  position=" ! Undefined GetCodePosition "
                        fi
                        local  variableNameSp=""
                        if [ "${variableName}" != "" ]; then  variableNameSp=" ${variableName} "  ;fi  #// Add spaces

                        if [[ "${type}" == "oneLine" ]]; then
                            echo  "@@@${variableNameSp}= \"${value}\" --------${position}---------------------------"  >&2
                        elif [[ "${type}" == "multiLine" ]]; then
                            echo  "@@@${variableNameSp} --------${position}---------------------------"  >&2
                            echo  "\"${value}\"" >&2
                        elif [[ "${type}" == "array" ]]; then
                            echo  "@@@${variableNameSp} --------${position}---------------------------"  >&2
                            local  count="${3-""}"  #// "${1-""}" means that "$1" default is "".
                            if [ "${count}" == "" ]; then
                                echo  "[0]: \"$4\""  >&2
                                echo  "[1]: ERROR: pp parameter is too few"  >&2
                            elif [ "${count}" == "0" ]; then
                                echo  "[]"  >&2
                            else
                                local  i=""
                                for (( i = 0; i < ${count}; i += 1 ));do
                                    echo  "[${i}]: \"$4\""  >&2
                                    shift
                                done
                            fi
                        else
                            echo  "@@@${variableNameSp}? --------${position}---------------------------"  >&2
                        fi
                        if [ "${type}" == "nameref" ]; then
                            echo  "WARNING: Not supported nameref (-n option) target in callee function in bash. Write the command:"  >&2
                            echo  "    pp  \"\$${variableName}\" \${!${variableName}}  \${#${variableName}[@]}  \"\${${variableName}[@]}\""  >&2
                        fi

                        if false; then
                            echo  "od -c:"  >&2
                            printf '%s' "${value}" | od -c  >&2  #// dump format
                            echo  "%q:"  >&2
                            printf "%q\n" "${value}"  >&2  #// escape format
                        fi
                    }
