            - 指定したコマンドを、親プロセスと異なる PGID にします  #search: PGID
            - 親プロセスに対して Ctrl+C キーを押したときや異常終了したときに期待通り子プロセスを終了するようにできます
            - プロセスをターミナルから切り離します。ファイルへリダイレクトすれば出力内容は分かります  #// 切り離さないのは set -m
