            その他数字: |
                0   リクエストを送らない  #search: Linux kill zero
                1   SIGHUP  再起動
                2   SIGINT  割り込み
                6   SIGABRT 中断
                9   SIGKILL 強制終了
                15  SIGTERM 終了
                17  SIGSTOP 停止
                18  SIGCONT 再開
