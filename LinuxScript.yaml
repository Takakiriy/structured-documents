perl:
    SNMP: |
        use SNMP;

        my $session = new SNMP::Session(
            DestHost  => 'localhost',
            Community => 'public',
            Version   => '2c',
            Timeout   => 500000,  # 0.5秒
            Retries   => 3,       # 3回リトライ  最大待ち時間 = Timeout × (Retries + 1)
        );

        # 非同期リクエスト（第3引数にコールバックを指定）
        $session->get(['sysDescr.0'], sub {
            my ($val) = @_;
            print "sysDescr: $val\n";
            SNMP::finish();  # ループを終了させる
        });

        # イベントループ開始（コールバックが呼ばれるまでここでブロック）
        SNMP::MainLoop();
