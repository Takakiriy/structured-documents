        手順: 高負荷の処理が途中で止まり、VSCode で SSH 接続によるフォルダーを開こうとしたとき。ssh コマンドでログインして mkdir を実行したら同じエラーが出るとき
        エラー:
            VSCode の Output タブ: |
                mkdir: cannot create directory ‘/var/lib/jenkins/.vscode-server’: Read-only file
            SSH でログインして mkdir: |
                $ ssh __SSHConfigName__
                $ mkdir temp1
                mkdir: cannot create directory ‘temp1’: Read-only file system
        対処:
            Linux を再起動します。ファイルシステムが読み取り専用モードではなくなります。
        原因:
            Linuxは、ファイルシステムにエラーが検出されると、データの損失や破損を防ぐためにファイルシステムを読み取り専用モードに切り替えることがあります。
