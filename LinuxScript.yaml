    待つ: #keyword: Linux bash wait for
        sleep:  #ref: ${programming}/スクリプト/シェルスクリプト/シェルスクリプト.svg#sleep  #keyword: Linux bash sleep
            書式:
                - sleep __Duration__
                - sleep 1s  #// 1秒待つ
                - sleep 1   #// 1秒待つ
                - sleep 0.5s  #// 0.5秒待つ
                - sleep 15m  #// 15分待つ
                - sleep 15m 10s  #// 15分10秒待つ  #ref: https://askubuntu.com/questions/1064484/use-sleep-with-minutes-and-seconds
                - sleep infinity  #// 永遠に待つ
            サンプル: |  #focus: sleep  #// Docker コンテナーが Exit するまで待ち、すべて Exit 0 の場合は exit 0、それ以外は exit 1
                while true; do
                    ps="$(docker-compose ps)"
                    echo "$ps" | grep "flyway_1 .* Exit"  && \
                    echo "$ps" | grep "elastic-template_1 .* Exit"  && \
                        break
                    sleep 2
                done

                echo "$ps" | grep "flyway_1 .* Exit 0" >> /dev/null  && \
                echo "$ps" | grep "elastic-template_1 .* Exit 0" >> /dev/null  && \
                    exit 0
                exit 1
        usleep:  #// マイクロ秒待ちます
            1ミリ秒待ちます: usleep 1000
            usleep が使えない場合: sleep 0.5s  #search: Linux bash sleep
