時刻:
    ISO 8601 形式: #keyword: ISO 8601,  ISO format date time ISO8601  #// 日時の書式
        日付: yyyy-mm-dd, yyyymmdd (8桁)
        時刻: hh:mm:ss, hh:mm, hhmmss (6桁)
        日時: yyyy-mm-ddThh:mm:ss, yyyymmddThhmmss
        秒の小数: ss.ssss (任意の桁数)
        タイムゾーン: +09:00, +0900
        正規表現: |
            [0-9]{4}-[0-9]{2}-[0-9]{2}(T| )[0-9]{2}:[0-9]{2}:[0-9]{2}.[0-9]*
        注意: 2023-11-30 12:34:56.789123456 +0900 は厳密にはISO 8601の標準形式ではありません。
            ISO 8601 風形式
        基本形式: 上記のハイフンやコロンが無いもの
        拡張形式: 上記のハイフンやコロンがあるもの
        コマンド:
            Linux date:  #search: date
    書式表現:
        Unicode LDML: #keyword:  #// ICU、Intl.DateTimeFormat。Java (SimpleDateFormat), JavaScript (Intl), C# などで採用
            書式: |
                yyyy/MM/dd          → 2025/11/25
                yyyy-MM-dd HH:mm:ss → 2025-11-25 14:30:45
                MM/dd/yyyy          → 11/25/2025
                y または yyyy = 年
                M または MM   = 月 (1桁または2桁)
                d または dd   = 日
                H または HH   = 時 (24時間)
                h または hh   = 時 (12時間)
                m または mm   = 分
                s または ss   = 秒
            ライブラリ:
                JavaScript:  #search: JavaScript formatDate  #search: Day.js YYYY
        strftime: |  #keyword: strftime format, Linux date format  #// UNIX/C言語由来の古典的標準 - Python、Ruby、PHPなどで採用
            %Y - 年（4桁）
            %m - 月（01-12）
            %d - 日（01-31）
            %H - 時（00-23）
            %M - 分（00-59）
            %S - 秒（00-59）
            %a - 曜日の省略形（Sun-Sat）
            %A - 曜日の完全形（Sunday-Saturday）
            %b - 月名の省略形（Jan-Dec）
            %B - 月名の完全形（January-December）
            %I - 時（12時間形式：01-12）
            %p - AM/PM
            %Z - タイムゾーン（EDT, PST等）
    date: #keyword: date,  Linux date  #// 現在の日時
        表示:
            -   date --iso-8601=seconds  #// 2023-10-26T12:34:56+09:00
            -   date --iso-8601=seconds  |  sed "s/:/_/g"  #// 2023-10-26T12_34_56+09_00
            -   date --iso-8601=date     #// 2023-10-26
            -   date +"%Y-%m-%dT%H"
        設定: sudo date -s "2023-10-26T12:34:56"
        計算: #search: bash 日時 計算
        比較: #search: bash compare date time
        タイムゾーン:
            export  TZ="JST-9"
            date
        ISO 8601 形式の詳細指定:
            秒まで:        date +"%Y-%m-%dT%H:%M:%S%z"
            小数部も含む:  date +"%Y-%m-%dT%H:%M:%S.%N%z"
            ミリ秒も含む:  date +"%Y-%m-%dT%H:%M:%S.%3N%z"
        英語形式:
            date +"%b %d %Y %H:%M:%S"
        他の書式:  #search: strftime format
    time: #keyword: time,  Linux time  #// コマンドの実行時間
        基本: time __CommandName__ __Parameters__
        オプション:
            -a: 追記します (-o オプションも必要です)
            -h: 人間に読みやすく表示します。指定しなくても十分読めます
            -o __FilePath__: ファイルに出力します
            -p: POSIX.2 に準拠する形式で表示します
        出力: |  #// -h オプションなし CentOS7
            real    0m0.002s    #// 実際の時間
            user    0m0.002s    #// ユーザー モード でのCPU実行時間
            sys     0m0.000s    #// システム モード でのCPU実行時間
        複数コマンド: |
            time {
                __CommandName__ __Parameters__
                __CommandName__ __Parameters__
            }
        出力のカスタマイズ:
            コマンド:
                TIMEFORMAT=%R
                time __CommandName__ __Parameters__
            出力: |  #// シンプルな経過時間表示
                0.002
            (%R): 実際の時間
            (%U): ユーザー モード でのCPU実行時間
            (%S): システム モード でのCPU実行時間
    faketime: #keyword:  #// 現在日時を指定した日時で実行します
