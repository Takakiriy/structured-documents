#Character Encoding: "WHITE SQUARE" U+25A1 is □.
#keyword: Linux.yaml, Linux  #ref: ${programming}/OS/UNIX-Linux/!Linux.svg
プロセス, ジョブ:  #keyword: Linux job,  Linux process,  process  #glossary: Linux
    子プロセス: #keyword: child process
        バックグラウンド プロセスは、起動したシェルのプロセスの子プロセスになります。
        親プロセスを終了すると子プロセスも終了します。
        コマンドが使えるか → #search: command
    パラメーター:  #keyword: Linux parameters
        全ての引数:  #search: Linux "$@"
        引数を一覧します: #search: bash arguments
        空文字列をコマンドに渡します:  #search: bash -c
        パイプとパラメーターの両対応:  #search: bash pipe and arguments
        ファイル名の引数に内容を指定します:  #search: <( )
        引数をキーボードから入力します:  #search: "$(</dev/stdin)"
    $0: #keyword: bash $0  #// スクリプトのパス
        値:
            環境変数 PATH によって見つかったスクリプトの場合: |
                "$0"="__FullPath__"
            相対パスで指定したスクリプトの場合: |
                "$0"="__RelativePath__"
        カレント フォルダー をスクリプトがあるフォルダーにする:  #keyword: cd $0,  cd this file folder
            bash debug 対応版:
                新しい方法:
                    移動: |  #keyword: bash-debug|systemd  #// カレント フォルダー をスクリプトがあるフォルダーに移動します
                        if [[ "$0" == *"/"*  &&  "$0" != *"bash-debug"*  &&  "$0" != *"systemd"* ]]; then  cd "${0%/*}"  ;fi  # cd this file folder
                            または
                        if echo "$0" | grep "/" | grep -E -v "bash-debug|systemd" > /dev/null; then  cd "${0%/*}"  ;fi  # cd this file folder
                            （後者は遅い）
                    応用: |  #keyword: ParentProcessCurrentFolder, ParentPWD, ThisScriptFullPath, ThisFolderFullPath, ParentFolderName
                        ParentProcessCurrentFolder="${PWD}"
                        if echo "$0" | grep "/" | grep -E -v "bash-debug|systemd" > /dev/null; then  cd "${0%/*}"  ;fi  # cd this file folder
                        ThisScriptFullPath="$( readlink -f "${0##*/}" )"
                        ThisFolderFullPath="${ThisScriptFullPath%/*}"
                        ParentFolderName="${ThisFolderFullPath##*/}"
                    WSL2 共有フォルダー:  #search: /mnt/c/ ThisFolderFullPath
                古い方法: |  #// カレント フォルダー をスクリプトがあるフォルダーに移動します
                    if [ "${_Dbg_DEBUGGER_LEVEL}" != "" ]; then
                        ThisScriptFullPath="${HOME}/tasks.sh"  #// Because $0 is not correct
                    else
                        ThisScriptFullPath="$( readlink -f "$0" )"
                    fi
                    ThisFolderFullPath="${ThisScriptFullPath%/*}"
                    cd  "${ThisFolderFullPath}"
            簡易不完全版:  #// bash __ScriptFileName__ で起動するときにエラーになってしまいます
                cd "${0%/*}"  # this file folder
            起動時の カレント フォルダー:  #search: ParentProcessCurrentFolder
        スクリプトと同じフォルダーにあるスクリプト等を起動: |  #keyword: ScriptFolderPath, ScriptPath
                ScriptPath="$0"
                ScriptFolderPath="${ScriptPath%/*}"

                "${ScriptFolderPath}/command-in-same-folder"  #// 起動
                cd  "${ScriptFolderPath}"
            #// $0 には必ず / があるため上記のコードで問題ありません。例 ./script
        フルパス:
            RootFolder="$( readlink -f "../../.." )"
    (&): #// バックグラウンド ジョブとしてプロセスを起動します  #keyword: linux ampersand
        書式:
            -   __Command__ &       #// 末尾に & を付けると、バックグラウンド プロセスとして起動します
            -   __FunctionCall__ &  #// 関数呼び出し（サブシェル）でもバックグラウンドで起動できます
        サンプル:  #keyword: linux process example
            ps f: |  #// プロセス ツリー を表示します。コマンドのパラメーターも表示されます
                $ sleep 10 &    #// 末尾に & を付けると、バックグラウンド プロセスとして起動します

                $ ps f           #// 10秒以内
                PID TTY      STAT   TIME COMMAND
                30168 pts/13   Ss     0:00 /usr/bin/bash
                30338 pts/13   S      0:00  \_ sleep 10    #//  バックグラウンド プロセス
                30393 pts/13   R+     0:00  \_ ps f
                9207 pts/12   Ss     0:00 /usr/bin/bash
                9404 pts/12   Sl+    0:02  \_ ...

                $ ps f           #// 10秒以降
                PID TTY      STAT   TIME COMMAND
                30168 pts/13   Ss     0:00 /usr/bin/bash
                30393 pts/13   R+     0:00  \_ ps f
                9207 pts/12   Ss     0:00 /usr/bin/bash
                9404 pts/12   Sl+    0:02  \_ ...
                [1]+  終了                  sleep 10   #//  バックグラウンド プロセスが終了した
                #// 終了は一度しか表示されません
            ps: |
                $ sleep 10 &    #// 末尾に & を付けると、バックグラウンド プロセスとして起動します
                [1] 14475      #// プロセス ID

                $ ps           #// 10秒以内
                PID TTY          TIME CMD
                14268 pts/13   00:00:00 bash
                14551 pts/13   00:00:00 sleep   #//  バックグラウンド プロセス
                14556 pts/13   00:00:00 ps

                $ ps           #// 10秒以降
                PID TTY          TIME CMD
                14268 pts/13   00:00:00 bash
                14620 pts/13   00:00:00 ps
                [1]+  終了                  sleep 10   #//  バックグラウンド プロセスが終了した

                $ ps          #// 終了は一度しか表示されません
                PID TTY          TIME CMD
                14268 pts/13   00:00:00 bash
                14677 pts/13   00:00:00 ps
        標準出力のファイル: #keyword: Linux job log  #// バックグラウンド プロセス の標準出力を見ることができるようにします
            サンプル: |
                bash ./_polling.sh  2>&1 > _1.log &    #// プロセスを起動します
                    #// bash を付けないと ps f コマンドを実行してもコマンドのパラメーターが表示されせん
                cat _1.log          #// 標準出力の内容を表示します
                ps f                #// プロセス ツリー を表示します。コマンドのパラメーターも表示されます
                kill __ProcessID__  #// プロセスを終了します
            ログ:  #search: Docker exec background
        終了待ち:
            wait, 全ジョブ終了待ち: #keyword: linux ampersand wait
                スクリプト: |
                    ( echo  "A";  curl -s  https://example.com/a ;  echo  "A(end)" ) &
                    ( echo  "B";  curl -s  https://example.com/b ;  echo  "B(end)" ) &
                    ( echo  "C";  curl -s  https://example.com/c ;  echo  "C(end)" ) &
                    wait
                実行結果:
                    A
                    B
                    C
                    <!doctype html>...
                    A(end)
                    <!doctype html>...
                    B(end)
                    <!doctype html>...
                    C(end)
        孤児プロセスの終了:  #search: kill orphaned processes
        関連:
            Visual Studio Code で複数の端末を開いて実行します:  #search: VSCode multi terminal tasks
    jobs: #// ジョブ（として扱われているプロセス）を一覧します
        ジョブ:
            ジョブは、シェルを起動したプロセスから起動した子プロセスです。
            jobs コマンドで表示されるジョブは、job コマンドを実行したシェルから起動したプロセスだけです。
        サンプル:  #keyword: Linux jobs example
            新しい端末: |
                $ jobs
                $ sleep 100010 &
                [1] 11783
                $ sleep 100022 &
                [2] 11807
                $ jobs
                [1]-  実行中               sleep 100010 &
                [2]+  実行中               sleep 100022 &
                $ fg 2
                sleep 100022
                ^Z
                [2]+  停止                  sleep 100022
                $ jobs
                [1]-  実行中               sleep 100010 &
                [2]+  停止                  sleep 100022
                $ bg 2
                [2]+ sleep 100022 &
                $ jobs
                [1]-  実行中               sleep 100010 &
                [2]+  実行中               sleep 100022 &
                $ jobs -l
                [1]- 11783 実行中               sleep 100010 &
                [2]+ 11807 実行中               sleep 100022 &
                $ kill -9 %1
                [1]-  強制終了            sleep 100010
                $ jobs -l
                [2]+ 11807 実行中               sleep 100022 &
        コマンド:
            一覧:
                - jobs  #// ジョブを一覧します
                - jobs -l  #// ジョブとプロセスIDを一覧します
            起動: __Command__ &  #search: linux ampersand
            直前に起動したジョブの情報:
                PID: $!
                ジョブ番号: （取得方法はありません）
            中断:  #search: Linux kill
        フォアグラウンド ジョブ: #keyword:
            ターミナルに表示されているプロセス
        バックグラウンド ジョブ: #keyword:
            (&) で起動したプロセス
        カレント ジョブ: #keyword:  #// 最近でバックグラウンドで起動されたジョブか、最後に停止したフォアグラウンドジョブ
            概要:
                最近でバックグラウンドで起動されたジョブか、最後に停止したフォアグラウンドジョブ
                jobs コマンドでは + で表示されます。
                fg, bg コマンドでジョブの番号を省略したときは、カレント ジョブ が対象になります。
            サンプル: |  #focus: +
                $ jobs
                [1]-  実行中               sleep 100010 &
                [2]+  実行中               sleep 100022 &
        関連:
            ジョブを強制終了します: #search: kill
    fg: #// バックグラウンドのジョブをフォアグランドに移動します
        サンプル: #search: Linux jobs example
    bg: #// 停止中のジョブを再開します
        サンプル: #search: Linux jobs example
    (Ctrl + Z): #keyword: bash 一時停止  #// フォアグランド ジョブ をバックグラウンドに移動して、停止します
        サンプル: #search: Linux jobs example
    (Ctrl + C):
        bash >> Ctrl + C キーを押したときの処理:  #search: bash function exit trap
        その他の言語:  #ref: https://rosettacode.org/wiki/Handle_a_signal
    終了コード: #keyword: exit code,  終了ステータス
        参照: $?
        終了コードを変数に入れます:  #search: exit code variable
        値:  #// POSIX / 慣習的に意味が決まっている終了コード
            POSIX 標準:
                0 — 成功
                1 — 一般的なエラー
                2 — シェルの使い方の誤り（misuse of shell builtins）
            bash の特殊値:
                126 — コマンドは見つかったが実行できない（権限なしなど）
                127 — コマンドが見つからない
                128 — exit に不正な引数
                128+N — シグナル N で終了（例：130 = Ctrl+C = SIGINT）
                129 — SIGHUP (Hangup / ターミナル切断)
                130 — SIGINT (Interrupt / Ctrl+C)
                131 — SIGQUIT (Quit / Core dump 付き終了)
                132 — SIGILL (Illegal Instruction / 不正命令)
                133 — SIGTRAP (Trace/Breakpoint Trap / デバッグトラップ)
                134 — SIGABRT (Abort / 異常終了)
                136 — SIGFPE (Floating Point Exception / 浮動小数点例外・ゼロ割)
                137 — SIGKILL (Kill / 強制終了)
                139 — SIGSEGV (Segmentation Fault / メモリ不正アクセス)
                141 — SIGPIPE (Broken Pipe / パイプ読み手不在)
                142 — SIGALRM (Alarm Clock / タイマー割り込み)
                143 — SIGTERM (Termination / 終了要求)
                153 — SIGXCPU (CPU Time Limit Exceeded / CPU時間制限超過)
                154 — SIGXFSZ (File Size Limit Exceeded / ファイルサイズ制限超過)
            慣習的（sysexits.h）:
                64 — EX_USAGE（コマンドライン引数の誤り）
                65 — EX_DATAERR（入力データの誤り）
                66 — EX_NOINPUT（入力ファイルが開けない）
                69 — EX_UNAVAILABLE（サービス利用不可）
                70 — EX_SOFTWARE（内部ソフトウェアエラー）
                71 — EX_OSERR（OS エラー）
                72 — EX_OSFILE（システムファイルが開けない）
                74 — EX_IOERR（I/O エラー）
                75 — EX_TEMPFAIL（一時的な失敗、再試行可）
                78 — EX_CONFIG（設定エラー）
                #// スクリプトで独自コードを定義する場合は 64〜113 の範囲が慣習的に使われます。
        エラーを発生させます:  #// エラーが発生したときに終了コードの値を表示します
            sed コマンドでエラーを発生させる: |
                $ sed 's/error'
                sed: -e expression #1, char 7: unterminated `s' command
                $ echo $?
                1
            (&&) でつなげたとき: |  #// 途中でエラーが発生したら、そのエラーの終了コードが格納されます
                $ sed 's/error'  &&  echo  "Pass"
                sed: -e expression #1, char 7: unterminated `s' command
                $ echo $?
                1
        $( ) の中の exit をキャッチします: #keyword: Linux substitution exit code
            bashlib:  #search: bashlib ExitIfMatched
            基本サンプル:
                local  out="$(x="$( echo "success S9" )" && echo "$x" || echo "(ERROR)" )"
                if [ "${out}" == "(ERROR)" ]; then  echo  "exit  2";  return  ;fi
            検証コード: |
                function  return_1() {
                    echo  "return_1"
                    return  1
                }
                out="$(return_1)"
                echo  "return_1: \$? = $?"  #=> return_1: $? = 1  ... OK
                echo  "return_1: \${out} = ${out}"  #=> return_1: $out = return_1  ... OK

                function  exit_1() {
                    echo  "exit_1"
                    echo  "exit_1 stderr" >&2
                    exit  1
                }

                function  exit_0() {
                    echo  "exit_0"
                    exit  0
                    echo  "----"
                }

                function  r2() {
                    local  out="$(return_1)"
                    echo  "r2: \$? = $?"  #=> r2: $? = 0  ... NG
                    echo  "r2: \${out} = ${out}"  #=> r2: $out = return_1  ... OK
                }
                r2

                function  r3() {
                    Out="$(return_1)"
                    echo  "r3: \$? = $?"  #=> r3: $? = 1  ... OK
                    local  out="${Out}"
                    echo  "r3: \${out} = ${out}"  #=> r3: $out = return_1  ... OK
                }
                r3

                function  r4() {
                    local  out="$(return_1  ||  echo $? )"
                    echo "r4: \${out} = ${out}"  #=> r4: ${out} = return_1\n1  ... OK
                }
                r4

                function  e4() {
                    local  out="$(exit_1  ||  echo $? )"
                    echo "e4: \${out} = ${out}"  #=> e4: ${out} = exit_1 ... NG
                }
                e4

                function  s5() {
                    Out="$(exit_0)"  ||  echo  "s5: || \$? = $?"  ;local  out="${Out}"  #=>  ... OK
                    echo "s5: \${out} = ${out}"  #=> s5: ${out} = exit_0  ... OK
                }
                s5

                function  e5() {
                    Out="$(exit_1)"  ||  echo  "e5: || \$? = $?"  ;local  out="${Out}"  #=> e5: || $? = 1  ... OK
                    echo "e5: \${out} = ${out}"  #=> e5: ${out} = exit_1  ... OK
                }
                e5

                function  r5() {
                    Out="$(return_1)"  ||  echo  "r5: || \$? = $?"  ;local  out="${Out}"  #=> r5: || $? = 1  ... OK
                    echo "r5: \${out} = ${out}"  #=> r5: ${out} = return_1  ... OK
                }
                r5

                function  e6() {
                    local  out="$(exit_1)"  ||  out="$?"
                    echo "e6: \${out} = ${out}"  #=> e6: ${out} = exit_1  ... NG
                }
                e6

                function  e7() {
                    local  out="$(x="$( echo "success SA" )" && echo "$x" || echo "$?" )"
                    echo "s7: \${out} = ${out}"  #=> s7: ${out} = exit_0  ... OK
                }
                s7

                function  e7() {
                    local  out="$(x="$( exit_1 )" && echo "$x" || echo "$?" )"
                    echo "e7: \${out} = ${out}"  #=> e7: ${out} = 1  ... OK
                }
                e7

                function  e7e() {
                    local  out="$(x="$( exit_1 )" && echo "$x" || exit $? )"  #// not exit  ... NG
                    echo "e7e: \${out} = ${out}"
                }
                e7e

                #// improved s5
                function  s6() {
                    out="$( echo "success S6" )"  || exit $? ;local  out="${out}"
                    echo "s6: \${out} = ${out}"  #=> s6: ${out} = success S6  ... OK
                }
                s6

                function  s62() {
                    out="$( s6 )"  || exit $? ;local  out="${out}"
                    echo "s62: \${out} = ${out}"  #=> s62: ${out} = s6: ${out} = success S6  ... OK

                    local  out="not overwritten"
                    s6
                    echo "s62: \${out} = ${out}"  #=> s62: ${out} = success S6  ... NG

                    local  out="not overwritten"
                    s62sub
                    echo "s62: \${out} = ${out}"  #=> s62: ${out} = not overwritten  ... OK
                }
                function  s62sub() {
                    local  out="$( s6 )"
                }
                s62

                #// improved s7
                function  s9() {
                    local  out="$(x="$( echo "success S9" )" && echo "$x" || echo "(ERROR)" )"
                    if [ "${out}" == "(ERROR)" ]; then  echo  "exit  2";  return  ;fi
                    echo "s9: \${out} = ${out}"  #=> s9: ${out} = success S9  ... OK
                }
                s9

                function  s92() {
                    local  out="$(x="$( s9 )" && echo "$x" || echo "(ERROR)" )"
                    echo "s92: \${out} = ${out}"  #=> s92: ${out} = s9: ${out} = success S9  ... OK

                    out="not overwritten"
                    s9
                    echo "s92: \${out} = ${out}"  #=> s92: ${out} = not overwritten  ... OK
                }
                s92

                function  e9() {
                    local  out="$(x="$( exit_1 )" && echo "$x" || echo "(ERROR:$?)" )"  #=> exit_1 stderr  ... OK
                    if [[ "${out}" =~ \(ERROR:[0-9]*\) ]]; then  echo  "exit ${out}";  return  ;fi  #=> exit (ERROR:1)  ... OK
                    echo "e9: \${out} = ${out}"
                }
                e9
        パイプ: #keyword: pipe exit code  #// パイプを含むコマンドの終了コード
            $?: 最も右のコマンドの終了コード
            ${PIPESTATUS[@]}: #keyword: PIPESTATUS  #// zsh は ${pipestatus[@]}  #// 各コマンドの終了コード
                PIPESTATUS:
                    #// Command1 | Command2 の場合:
                    Command1 の終了コード: ${PIPESTATUS[0]}
                    Command2 の終了コード: ${PIPESTATUS[1]}
                    すべて成功したことをチェックします:
                        GetFirstNonZeroValue を使う場合:
                            return  $( GetFirstNonZeroValue "${PIPESTATUS[@]}" )
                            #search: GetFirstNonZeroValue
                        サンプル: |
                            local  exitCodes="${PIPESTATUS[@]}"       #// 一度に参照しないと、このコマンドで上書きされてしまいます
                            test "${exitCodes}" == "0 0"  ||  Error   #// パイプの段数に合わせて 0 の数を増やします
                        補足:
                            #// 一度代入しないとエラーになります  test: too many arguments
                            test "${PIPESTATUS[@]}" == "0 0"  ||  Error
                サンプル:  #focus: exitCode
                    基本 (bash): |
                        Command1 | Command2
                        local  exitCode=${PIPESTATUS[0]}
                    bash, zsh 共用: |
                        Command1 | Command2
                        local  exitCode=${PIPESTATUS[0]}${pipestatus[0]}
                            終了コードによって中断します:  #search: set -e
            関連:  #serach: set -o pipefail
    _polling.sh :  #// バックグラウンド プロセス のテストに適したスクリプト
        エラーにならなくなるまでの場合: |
            while true; do
                command  &&  break
                sleep 2
            done
        while を使う場合: |
            while [ 条件文 ]; do
                date  #// 現在の日時を表示します
                sleep 2
            done
        if を使う場合: |
            while true; do
                date  #// 現在の日時を表示します
                if [ 条件文 ]; then
                    break
                fi
                sleep 2
            done
    $!:  #// 最後に起動した バックグラウンド プロセスの PID (プロセスID)
        サンプル: |
            sleep 10 &
            echo $!
        wait $!:  #search: Linux wait
    ps: #// プロセスを一覧します  #keyword: ps
        サンプル:
            - ps
            - ps -auxww
            - ps -eo pid,pgid,ppid,cmd  #// PID, PGID, PPID, コマンド ライン を一覧します
            - 詳細: #search: linux process example
        f: プロセス ツリー を表示します  #search: linux process example
        -a: 全プロセスを表示します
        -u: ユーザー名も表示します
        -x: tty を持っていないプロセスも表示します。他のユーザーが起動したプロセスも表示します
        -ww: 起動コマンドを完全に表示します。指定しないと1行で表示できる範囲以降の部分は表示されません。
            #ref: https://stackoverflow.com/questions/2159860/viewing-full-output-of-ps-command
        -e: #keyword: ps -e  #// 全プロセスを表示します。プロセス名は __ProcessShortName__
            ps -e:  #// 表示されるプロセス名は ps aux で表示される実行ファイル名の一部の可能性があります。
                サンプル実行: |
                    $ ps -e
                    __PID__ __?__ __RunningTime__ __ProcessShortName__
                    ...
                補足:
                    - __ProcessShortName__ は、他のプロセスと重複する可能性があります。
                    - -f オプションと同時に表示するとプロセス名が変わることがあります  #search: ps -ef
                変更: #keyword: edit ps -e  #// プログラムで変更することができます。すでに起動オプションで対応している可能性もあります
                    Ruby: |
                        Process.setproctitle("新しいプロセス名")
                    Python: |
                        import setproctitle
                        setproctitle.setproctitle("新しいプロセス名")
                    Go: |
                        syscall.SYS_PRCTL
                    ラッパー スクリプト: |
                        #!/bin/bash
                        exec /path/to/bundle "$@"
            ps -ef: #keyword: ps -ef  #// 詳細表示です。ただし、プロセス名が変わることがあります
                注意: |
                    プロセス名に相当する情報の情報源が変わってしまうことがあります。
                        $ cat /proc/__PID__/comm   #// ps -e の情報源
                        bundle
                        $ cat /proc/__PID__/cmdline  #// ps -ef の情報源。プロセスが変更可能
                        supervisor:td-agent
            systemctl status: |  #// サービスのプロセス名は、systemctl status コマンドの Main PID に表示されます。
                    $ systemctl status __ServiceName__
                    Main PID: __PID__ (__ProcessShortName__)
                    ...
        ps が使えない場合:
            cat /proc/*/comm
