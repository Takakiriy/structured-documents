                            シグナルの送信先が変わるケース: #keyword: bash signal target  #// シェルが変わるような場合
                                要因:
                                    同一 tty 内でのプロセスグループ変更:
                                        tcsetpgrp: POSIX の API 呼び出し（内部的には ioctl(TIOCSPGRP) 相当）で、フォアグラウンドプロセスグループを変える（set -m + & が該当）
                                    別ドメインへの中継・転送:
                                        wsl: Win32 コンソールという別の配送ドメインが新規生成されるのが原因で、シグナルの送信先が変わる
                                        ssh: 多くの場合、pty がリモート側に割り当てられ、Ctrl+C はキー入力のバイト（0x03）としてそのままリモートの pty に転送され、リモート側の tty ドライバーが SIGINT を生成します。ローカルの ssh プロセス自体は大元と同じフォアグラウンドグループにいることが多いですが、SSH プロトコルの都合上、ローカル側で SIGINT が発生してもそのままではリモートには伝わらない構造になっています。
                                        tmux: pty が raw モードになっているため、Ctrl+C は端末ドライバーによる SIGINT 変換が起きず、生バイトとして tmux クライアントに渡り、tmux がそれをセッション内の pty に転送し、そちらの tty ドライバーが改めて SIGINT を生成します。
                                影響範囲:
                                    Ctrl+C のシグナルの送信先: wsl, ssh, tmux などが実行するプロセスに変わります
