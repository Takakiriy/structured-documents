                    #ref: https://qiita.com/koichi2426/items/79e44afe1f0febb95e6d
            その外2, Interface Adapter: #keyword: The Clean Architecture interface adapter
                Controllers:  #// 外部からの入力（HTTPリクエスト、フォームデータなど）を、Use Case が理解できる形式（Input DTO）に変換します。
                Gateways (Repository):  #// sUse Case が定義したインターフェースを実装し、DBやAPIなどの外部リソースへのアクセスを抽象化します
                Presenters:  #// Use Case の出力（Output DTO）を、View やクライアントが必要とする形式（ViewModel, JSON など）に変換します。表示ロジックはここに集まります。
            その外3, Framework:
