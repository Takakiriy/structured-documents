            Parallel Inheritance Hierarchies:  #// 片方のクラスのサブクラスを作るたびに、もう片方のクラスのサブクラスも作らなければならない状態
                #ref: https://stackoverflow.com/questions/18434577/is-parallel-inheritance-hierarchies-really-a-code-smell
