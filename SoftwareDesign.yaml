        Facade スーパークラス:
            使う必要があるメソッドなどが増えたときは、スーパークラスも無条件に追加します
        冗長 Facade スーパークラス:
            所有親クラスが特に機能が無く、所有子クラスに委譲している構成は、所有関係が冗長です。
            この構成をリファクタリングする前なら、所有親と所有子の両方を修正します。
            修正前に動作確認をします。たとえば、メソッドを追加しないで、flushCache を毎回実行させるなど
        インターフェース:
            背負う:  #// 継承することで義務を負うこと
                サンプル: |
                    #// IDisposable インターフェースを背負う
                    public interface IProductRepository : IDisposable
                解説: |
                    IProductRepository が IDisposable を継承(: IDisposable)していると、
                    このインターフェースは Delete だけでなく Dispose も持つことになります。
                    すると、このインターフェースを受け取る利用側は、Dispose を呼ぶ責任、つまり破棄義務を負わされます。
                    抽象が IDisposable を継承することで、その破棄義務を抽象自身が引き受けて利用側に押し付ける、
                    これが「背負う」と表現したものの実体です。
                    「インターフェースが IDisposable を継承する」→「その結果、利用側が破棄義務を負う」
