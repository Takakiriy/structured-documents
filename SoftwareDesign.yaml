    DAO の種類:  #// DTO のアクセス対象
        - DB（またはそのキャッシュ、または モックのデータ YAML/JSON、
            アプリケーションのDBアクセス関数のモック。ORM操作はしない） #search: Python unittest.mock
        - DB のバージョン違い（出力構造体の型やサブクラスの違い）
