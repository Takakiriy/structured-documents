                                            Composer のコードを List 8.16 ように構成すること
                                        DI container の場合:
                                            動的に依存注入が行われるためグラフの把握が難しく、この問題が広がりやすい
                                            捕らわれた依存を検出するツールの活用が重要
                            8.4.2　リーキー抽象化でライフスタイルの選択をコンシューマーに漏らす: #keyword: DI book leaky abstraction  #既読
                                Lazy<T> による生存戦略の漏洩:  #ref: ${typrm_files}/ref/SoftwareDesign/DI_leaky_abstraction_lazy.html
                                コレクションによる漏洩:  #search: DI book List 8.21
                                用語:
                                    依存が注入されるクラス:
                                        オブジェクト グラフ の親側のオブジェクト。
                                        注入するクラス（処理） = 合成基点
                                        所有子も合成基点に注入されるクラスではあるが、
                                        依存は所有子なので「依存が注入されるクラス」は親側のオブジェクトです。
                                    依存を利用するクラス:
                                        オブジェクト グラフ の親側のオブジェクト。
                            8.4.3　インスタンスをスレッドの生存期間に縛ることによる並行性バグ: #keyword: DI book thread
                                _:
                                    -   （解決法の１つとして）リクエストに生存期間を紐づけます p342 リスト8.24の上
                                    -   生存期間は短くなる p342 下のメモ
                                    -   Per-Thread life style をサポートする DI コンテナー があるが、本書では非推奨 p339
                                    -   並行処理に関するバグの再現性は一般的に低いので解決が困難 p342 上のメモの下
                                メモ:
                                    -   リクエストのコンテキストをグローバル変数に退避して再利用すると問題が発生します
                                    -   スレッドセーフでないものでも、プロセス並列であれば問題ありません
                                スレッドの生存期間は明確ではないことが多い:
                                    -   （意見）リクエストのコンテキストではなく ThreadStatic に配置するのは、そもそも間違っているので、この部分は本題とは関係ない話
                                    -   （意見）明確ではないことがあるのは、ThreadStatic 変数をクリアする対策をしない場合に限定した状況のみ
                                    -   「スレッド・プールの状態によって～変わります」によって ThreadStatic が不定なのはバグ
                                    -   それぞれのスレッドによって生存期間は様々。
                                    -   フレームワークによって暗黙的に作られたスレッドが、ユーザーが書いたコールバックを呼ぶこともあります
                                    -   非同期(await)を書くと、フレームワークによっては別のスレッドが非同期部分を実行することがります
                                複数スレッドの問題:  #// リクエストのコンテキストが解決している問題
                                    -   図 8.12 I/O リクエストを非同期で呼び出して、I/O 待ちが完了した後、別のスレッドが実行するフレームワークがある
                                本書で扱っていないこと:
                                    -   ThreadStatic 変数をクリアする対策
                                    -   ローカル変数ではメソッドのスコープを超えて参照することができない問題
                                    -   ThreadStatic 変数は自スレッドしかアクセスできないのでレーシングが起きないこと（問題が無いこと）
                                    -   .NET の AsyncLocal<T> で非同期でもスレッドが移動しても変わらないコンテキスト
                                    -   Node.js AsyncLocalStorage  #search: Node.js AsyncLocalStorage
