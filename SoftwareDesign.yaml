        #// 原則というほど一般的に言えることではない。ただ、部分的に使われる方針ではあるので、その方針を認識するためのパターン名としては有効
        #ref: Clean Architecture Book >> 第7〜11章
        単一責任の原則, SRP, Single Responsibility Principle: #keyword:
            #keyword: SOLID SRP, 単一責任原則
            #// 分けて集約する
            #// スパゲッティ プログラム の原因
            #// 責任を1箇所に凝集させる意味ではない
            モジュールは1つのアクターに対してのみ責任を持つべき。「変更する理由が1つだけであるべき」という言い方もします。
            Robert Martin 自身も後に「a reason to change」を「a single actor / stakeholder」と言い換えたのは、たぶんこの曖昧さを認識していたからで、「変更を要求してくる人(役割)が一人か」という形に置き換えようとした。でもこれも、「役割」をどう粒度で切るかという同じ問題が一段ずれただけで、根本的な解決にはなっていない気がします。
            「そのクラスを別の文脈に持っていったとき、一緒に連れていきたいか」と「このクラスのドメインの語彙か」
            分ける基準は例えば：
                * 誰が変更要求を出すか、誰に変更する責務があるか
                * どのレビュー担当が違うか
                * デプロイ単位が違うか
                * テスト観点が違うか
                * 障害時の責任者が違うか
                * 変更頻度が違うか
                * ライフサイクルが違うか
            分けないときのデメリットは例えば：
                - SMTP を送りたいだけなのに、config.json の変更で巻き込まれる
        オープン・クローズドの原則, OCP, 開放閉鎖の原則, Open/Closed Principle: #keyword:
            #keyword: 開放/閉鎖原則, OCP
            #// ファイルなどの open/close ではない　 #search: close を確実にする手段
            - 既存コードを変更せずに、新しいコードを追加するだけで機能を拡張できる状態を目指す原則。
            - 拡張に対してオープン、修正に対してクローズドであるべき。新しい機能を追加するとき、既存のコードを変更せず追加だけで済む設計が理想。
        リスコフの置換原則, LSP, Liskov Substitution Principle:
            #// インフラ実装にのみ言えること。依存性逆転の原則で扱う関係では言えない
            サブクラスを使っても親クラスと同じように動くべきという原則。
            派生クラスは基底クラスと置き換えられるべき。
            #//（意見）イベントがインターフェースの場合、動きは異なるのは明らか。なので LSP は原則ではなく抽象的に同じ動作を期待するケースがあるということしか言えていない
        インターフェース分離の原則, ISP, Interface Segregation Principle: #keyword:
            #// 複数インターフェース
            小さく分割されたインターフェースの方がよい。（大きなインターフェースよりも）
            使わないメソッドへの依存を強制すべきでない。
        依存性逆転の原則, DIP, Dependency Inversion Principle: #keyword:  #ref: https://ja.wikipedia.org/wiki/依存性逆転の原則
            #keyword: 依存関係逆転の原則, 逆方向の import  #search: import 相互
            #// 双方向依存
            - 上位モジュールは下位モジュールに依存すべきでない。どちらも抽象に依存すべき。 #// 上位モジュールが不明
            - 「高レベルのモジュールは低レベルの実装の詳細に依存してはいけない」という方が原則で、「逆方向の依存を追加する」はその原則を守るための手段です。
                #// めちゃくちゃややこしい
            #// UIやDBといった種類によって実装依存と型依存の方向を統一すべき
            #// インターフェースは維持コストが大きすぎる
デザイン パターン:  #keyword: design pattern
    GoF: #keyword:  #ref: ${programming}/方法論/オブジェクト指向.svg#gof
        Abstract Factory パターン: #keyword:
            _: パラメーターによって異なるサブクラスのオブジェクトを生成する
                create(name)
                #ref: ${programming}/方法論/オブジェクト指向.svg#AbstractFactory
                #ref: https://xtech.nikkei.com/it/article/COLUMN/20051202/225609/
            Abstract Factory の続きの処理:  #keyword: Abstract Factory next operation,  event service privider DI
                デメリット:
                    返したオブジェクトがサービス一覧やイベント管理などの場合、
                    Abstract Factory で行う（初期化）処理の後の処理が追えなくなる。
                    なぜなら、サービス一覧はオブジェクトを渡すことしかしないため。
                対処:
                    - 返したオブジェクトのメソッドを追う
                    - （初期化）処理中に書かれているコールバックされる無名関数などを追う
            関連:
                #search: DI
                #search: Factory Method パターン
        Adapter パターン: #keyword:
            Target Interface - Adapter - Adaptee
            #ref: https://qiita.com/shoheiyokoyama/items/bd1c692db480b640c976
        Command パターン: #keyword:
            メリット:
                処理内容を抽象化して順序を制御する:
                    ただし、処理の組み替えが頻繁に起きる場合でなければメリットはほぼ無い
                キューイングや遅延実行:
                    ただし、リストに関数を入れるだけで実現できる。
                ロールバック, リトライ:
                    ただし、例外処理やロールバック関数の呼び出しやループで代替可能
                ログ・監査証跡:
                    ただし、関数内でログの出力をよびだせば十分
            デメリット:
                不要な抽象化: 処理内容を抽象化する必要がない場合、処理内容が分からなくなる
                    file.save()
                    printer.print()
                    ここでは
                        execute()
                    という抽象化を入れてもメリットがありません。
                    呼び出し側は
                        save を呼ぶ
                        print を呼ぶ
                    を普通に書けばよいからです。
            #↓ 関連
            トランザクション:  #search: transaction
            Unit of Work: #search:
        Chain of Responsibility パターン: #keyword:
            解説:  #ref: https://refactoring.guru/ja/design-patterns/chain-of-responsibility
            不要なケース:  #// 関数コールで十分なケース
                処理者が事前に決まっている
                すべての処理を必ず実行
            有用なケース:
                条件分岐が複雑
                処理者が動的に変わる
                最初にマッチしたら終了
                ハンドラーの追加頻度が高い
            関数呼び出しや Pipeline/Middleware との比較:
                普通の関数呼び出し: 決められた処理を順次実行
                Chain of Responsibility: 動的に最初に成功した処理まで実行、または、マッチした処理だけ実行
                Pipeline/Middleware: すべてのステージを通過
                #ref: ${typrm_files}/ref/SoftwareDesign/Chain_of_Responsibility_Compare.md
                #search: Middleware pattern
                    #ref: ${typrm_files}/ref/SoftwareDesign/PipelineMiddleware_pattern.html
        Facade パターン: #keyword:  #// ファサード
            概要: 大きなプログラムを使って処理を行う場合、 関係しあっているたくさんのクラスを適切に制御しなくてはいけません。
                その処理を行うための「窓口」を用意しておくと、 個別にたくさんのクラスを制御しなくても、「窓口」に対して、要求するだけですみます。
                サブシステムを１つのクラスとみなし、構成するクラスによる分類の否定に相当します。
            Facade インターフェース:
                窓口の実装はインターフェースが適しています。
                ドキュメントやコメントだけで十分なこともよくあります。
            注意: #search: 過剰設計
                Facade は構造体ではなく、オリジナルの computed プロパティ（getter＋メモ化）にすること。そうしないとデータのソースがどこにあるのかかなり分かりにくくなります。
                追加の情報が欲しいときに、Facade も変更しなければならなくなってしまいます。
            Clean Archtecture:  #search: The Clean Archtecture Facade
            Wikipadiaより:  #ref: https://ja.wikipedia.org/wiki/Facade_パターン
                - Facadeクラスはあくまでサブシステム内部に仕事を投げるだけで複雑な実装は持たない。
                - Facadeパターンはサブシステムの直接使用を妨げない。
            サンプル:
                コンパイラー = 字句解析器, 構文解析器, ... の Facade  #ref: https://ja.wikipedia.org/wiki/Facade_パターン
        Factory Method パターン: #keyword:
            _: 関連するオブジェクトを生成するメソッド
                #ref: ${programming}/方法論/オブジェクト指向.svg#FactoryMethod
                #ref: https://xtech.nikkei.com/it/article/COLUMN/20051202/225609/
            メリット: 関連するクラスが一覧できる。関連を持ったオブジェクトを返せる
            関連するオブジェクトを生成する:
                ClassA.createB()
            関連するオブジェクト一式を生成する:
                ClassA.createObjects()
            関連:
                #search: Abstract Factory パターン
                #search: JavaScript from
        Mediator パターン: #keyword:
            概要: 調停者。親に自分に関する状態を決めてもらう。n対n の関係を 1対n にする
            概念図: #ref: ${my_images}/2021/mediator_pattern.png
            Mediator インターフェース:  #// 調停者、親、相談を受けるオブジェクト。例：フォーム
                consultation():
            Collegue インターフェース:  #// 同僚、子、相談を依頼するオブジェクト。例：ボタン
                mediator: Mediator
            参考: https://www.techscore.com/tech/DesignPattern/Mediator.html/
        Observer パターン: #keyword:  #ref: ${typrm_files}/ref/SoftwareDesign-AI.yaml#label: observer pattern
            - 図  #ref: ${my_images}/2025/observer_pattern.png
            - サブジェクト --(通知)→ オブザーバー
            - サブジェクトは１つまたは複数のオブザーバーを管理します
                管理はスーパークラス「など」のライブラリにできますが、
                管理相手を固定にするほうが簡単な実装になりそうです
            - オブザーバーのスーパークラスは、サブジェクトの具象クラスから要求されたインターフェイスです
            - オブザーバーは import 相互依存における親側です。子→親に通知を行うため、インターフェースが必要です
        Strategy パターン: #keyword:  #ref: https://ja.wikipedia.org/wiki/Strategy_パターン
            単にポリモーフィズムを使っている形
            アルゴリズム（実装?）を共通のインターフェースを持つ独立したクラスとして定義し、実行時に交換可能にする
    その他:  #glossary: pattern
        DI: #search:
        DTO: #search:
        Middleware: #keyword: Middleware pattern
            概要図: #ref: ${typrm_files}/ref/SoftwareDesign/PipelineMiddleware_pattern.html
        NullObject: #keyword: NullObject pattern
            - 無効値・不在を表すオブジェクトを、本物と同じ型やインターフェースで用意するパターン。
            - null チェックが至る所に散らばる問題を解消します。
            - 型やインターフェースが更新されたら Null Object も追従する必要があります。
            - そのため、Null Object を生成または取得する static method を用意して呼び出します。
            #// Martin Fowler の Patterns of Enterprise Application Architecture や Robert C. Martin（Uncle Bob）の著作で広く言及しています
        Registry:  #keyword: registory pattern ではない  #// オブジェクトやサービスを「名前」や「キー」で登録・取得できるようにする設計パターンです
            推奨 >> クラスから生成: |
                export type Class<T=any> = (new (...args: any[]) => T);  // JavaScript class is constructor

                export interface  ComposeParameters {
                    strategyClass: Class;
                }



            機能 >> 遅延生成:
                コンストラクターでいろいろやりたいときに必要となるオブジェクトをすべて用意してから
                コンストラクターを呼び出すことができます。
                たとえば、compose 関数（Composition Root）にインスタンスを渡すようにすると、
                そのインスタンスを生成することができない場合があります。
            参考）サンプル: |  #// TypeScript
                // インスタンス型まで保持する
                type Registry = {
                    Logger: typeof Logger;
                    UserService: typeof UserService;
                    OrderService: typeof OrderService;
                };

                const registry: Registry = {
                    Logger,
                    UserService,
                    OrderService,
                };

                // 型が効く
                const keyOfLogger = keyof Logger;
                const logger = new registry[keyOfLogger]();      // Logger 型

                const keyOfUserService = keyof UserService;
                const svc = new registry[keyOfUserService](logger); // UserService 型
            類似のパターン:
                - Service Locator
                - Factory パターン（これは関数）
                - Plugin Registry
                - Type Registry
                - Extension Registry
        Shim: #keyword:
            古い環境で新しいAPIを使うためのライブラリ。Adapter パターン。
            es5-shim npm パッケージは、ECMAScript 5 (ES5) をサポートしていないブラウザーで ES5 を動かせるようにする Shim です。
            #ref: https://qiita.com/ybiquitous/items/3104beb84b78ca15f407
            #ref: https://stackoverflow.com/questions/6599815/what-is-the-difference-between-a-shim-and-a-polyfill
        Polyfill: #keyword:
            Web (Browser) API の Shim
            #ref: https://qiita.com/ybiquitous/items/3104beb84b78ca15f407
抽象化, 概念化: #keyword:
    プログラミングにおける概念化:
        概要:
            コマンドの実行と結果の確認、ネット検索
            ==[抽象化]==> パラメーターとユースケースの理解
            ==[概念化]=>> ユースケースの整理（CRUDなど）、暗記、基本的な操作の訓練、宣伝
            ==[具体化]==> 業務における別のユースケースでの実施
    一般的な概念化:
        参考: #ref: https://studyhacker.net/conceptual-skill
        抽象化の難しさ: それはピント。一方向に動かすだけではピントは合わない
    クラスの依存関係: #keyword: クラスの依存関係,  include 親子関係 階層構造 オブジェクト指向
        継承関係: #keyword:
            スーパー クラス: #keyword:
            サブ クラス: #keyword:
            インターフェース: #keyword:
            実装クラス: #keyword:
            UML: super class △-- sub class または interface class ◯-- implement class
        所有関係: #keyword: 所有関係,  while - part,  包含関係
            コンテナー: #keyword:
            コンポーネント: #keyword:
            UML: container class ◇-- component class
            #search: (ChatGPT-GPT4) Classes that have an inheritance relationship are called super class and sub class, but how do you say the ownership relationship?
            #ref: https://www.google.com/search?q=container+class+component+class
        方針: #keyword: import 循環参照,  import 相互参照
            #search: Python 循環 import
            #// import 元 → import 先。import 元のファイルに import 文を書きます
            - 所有親 → 所有子
                画面 → サービス(Web API, サービスをロード) → ドメイン（データ） → 利用サービス
                Facade → オリジナル データ  （Facade 自体は非推奨）
            - 継承子→継承親
                A←→B はできないので、A→「Bのインターフェース」と、B→「Aのインターフェース」にする
                #search: Observer パターン
        対処法: #keyword: import 相互依存,  circular import  #// 相互依存しなようにする方法。相互依存するとエラーになる場合。 mutual import ではない
            #search: Python 循環 import
            一般:
                相互依存する位置を特定します:
                    A → A → B → B → B → A （A, B は画面、サービスなどの種類） の場合、
                    A → B の import、または B → A の import のうち、最近変更したコードに注目します。
                import 先を小さい共通部分として抽出する場合:
                    抽出したファイルを import する。
                    または、定義があるファイルだけ import する。（大きな import をしない）
                上記の→に合うように定義位置を移動する場合:
                    たとえば、親の兄弟を引数で取るオブジェクトの初期化コードは、親で子オブジェクトの初期化をするコードに変える。
            コールバック関数:  #// 所有子にくるイベントを親で処理するために、親が定義する関数
            グローバル変数:  #search: declare global dependency
            逆依存性の原則:
                #search: The Clean Architecture
            弱参照:  #search: weak reference
            Go: #ref: ${programming}/プログラミング言語、環境/go_language.svg#import_cycle_not_allowed
            Python: #search: Python 循環 import
            Swift:
                弱参照: |  #keyword: weak reference
                    weak var documentBrowserViewController: UIDocumentBrowserViewController?
                    参照されているオブジェクトが解放された場合に自動的にnilになります。
                    #ref: ${typrm_files}/ref/Swift-AI.yaml#label: weak reference
            その他: プロジェクト名 + import で検索
    疎結合, 独立性: #keyword: 疎結合, 独立性 モジュール化 モジュール性 高凝集 凝集性 カプセル化 分離
        制御の抽象化
    過度な抽象化, 早すぎる抽象化: #keyword: Over-abstraction,  Over-engineering,  Premature Abstraction,  オーバー エンジニアリング,  過度な抽象化, 早すぎる抽象化, 過剰な抽象化, 行き過ぎた抽象化, 野心的
        #// 将来を見越して抽象的なモジュールを開発したけど、いざその時になったら使い物にならなかった
        _: 実際に共通化ができるまでは、公式化しないでください。
        #ref: ${typrm_files}/ref/SoftwareDesign-AI.yaml#label: Over-abstraction
        3回ルール: #keyword: rule of three,  3回ルール  #ref: https://en.wikipedia.org/wiki/Rule_of_three_(computer_programming)
            _: 類似コードの2つのインスタンスはリファクタリングを必要としないが、類似したコードが3回使われた場合は新しい手続きに抽出すべき
                DRY 原則 よりも YAGNI 原則（You Aren't Gonna Need It）を優先
        YAGNI 原則: #keyword:  #ref: https://ja.wikipedia.org/wiki/YAGNI
            #keyword: そんなの必要ないって, 必要になってからで良い
            実際に必要となるまで機能を追加しない方が良い。必要になってからで良い
            "You aren't gonna need it."（そんなの必要ないって）
        KISS 原則: |
            "Keep It Simple, Stupid."（シンプルにしろバカ）
        1回しか参照されない変数:  #// かつ、値に対する属性情報が付加されていない、かつ、説明変数ではない
    DRY の原則: #search:
    設定より規約: #keyword:  #// Convention over Configuration  妥当な初期値（規約）をあらかじめ用意しておくこと
        サンプル:
            - User というクラスを作ると、規約により自動的に users という名前のテーブルに対応づけられます
            - DI の auto-registration
        デメリット:
            規約を覚えていないと「なぜこう動くのか」が分かりにくい
    リーキー抽象: #keyword: Leaky Abstraction, リーキー抽象, 漏洩する抽象, 名前 実装 表面 露出 出る Joel Spolsky
        #ref: https://www.joelonsoftware.com/2002/11/11/the-law-of-leaky-abstractions/
        #ref: https://en.wikipedia.org/wiki/Leaky_abstraction
        IDisposable の例:  #search: IDisposable Leaky Abstraction
        抽象化は便利だが、実装を理解しないといけない場面が来る:  #// 避けられない現実
            反論:  #// 避けられない現実ではない
                「実装を理解しないといけない場面が来る」ことは、名前に実装を漏らす理由にならない
                「実装を理解しないといけない場面が来る」は事実としてあり得る。
                しかしその場面では、開発者は名前ではなく実装のコードやドキュメントを直接見る。
                名前を見る場面と実装を見る場面は別々に存在しており、混在させる必要がない。
                したがって「実装を理解しないといけない場面が来る」ことは、名前に実装を漏らす理由にはならない。
                名前は常に意図だけを表せばよく、実装を理解しないといけない場面への対処は、実装を直接見ることで行われる。
                unlink はその典型的な失敗例である。ファイルを削除したい場面では unlink という名前は不要な知識を要求し、
                実際にハードリンクの仕組みを理解しないといけない場面が来たとしても、
                開発者はソースコードやOSのドキュメントを直接参照するのであって、名前から得られる情報に頼るわけではない。
                #search: POSIX unlink
            抽象化への支持:  #ref: https://www.cs.cornell.edu/courses/cs211/2006sp/Lectures/L08-Abstraction/08_abstraction.html
                抽象化はクライアントとインプリメンターという二つの役割を作り出す。
                The interface creates a contract between the client and the implementer.
                クライアントは実装がどのように動いているかを理解しなくても関数を呼び出せる。
                もし問題が起きた場合、インターフェースの存在により「クライアントがインターフェースを誤って使っているのか、
                インプリメンターが実装を誤っているのか」のどちらかに責任を切り分けることができ、
                どちらかのコードを修正すればよいことが明確になる
図解:
