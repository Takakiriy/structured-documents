        境界を越える, Crossing boundaries:
            図: #ref: https://blog.cleancoder.com/uncle-bob/images/2012-08-13-the-clean-architecture/CleanArchitecture.jpg
            - 制御は、コントローラー（入力）で始まり、ユースケース（処理）を通過し、最終的にプレゼンター（出力）で実行されます  #// 図のピンクの線
            - 依存関係は、コントローラー → ユースケース ← プレゼンター  #// 、プレゼンターからユースケースの関係が制御と依存関係で逆になっている
            - インターフェース（Output Port）だけを知っている
                #// こうすることで、ビジネス ロジック（Use Case）をUIやフレームワークの変更から守ります
            - インターフェースのメソッドの引数にあるデータは、ビジネス ロジック のみ
        境界を超える型:  #// Domain と UI で同じ型の場合
            2種類ある場合:  #// UI (API) でも使う汎用型と、DB で使う型
                DB ラッパーから UI の型を import します
        DTO Explosion, ほぼ同じクラスが並ぶ批判:  #//「ほぼ同じクラスが並ぶ」のはクリーンアーキテクチャのよくある批判点です
            Shadow Class:  #// 独自用語。ほぼ同じ構造で並ぶ2つのクラス
                説明: |
                    Clean Architecture の Dependency Rule に従い、内側の Entity を外側のレイヤーの都合から守る必要がある。
                    そのため境界（Boundary）をまたぐ際には、Entity をそのまま渡さず、DTO や ViewModel に変換するのが定石である。
                    変換は Presenter が担い、結果として得られるオブジェクトはロジックを持たない Humble Object となる。
                    しかし、この DTO/ViewModel が Entity と構造的にほぼ一致し、かつ変更も常に同期されている場合、
                    それは設計上の意義を失ったShadow Class に堕している。Shadow Class は Entity の影として境界の外側に張り付いているだけで、
                    Dependency Rule を形式的に満たすためだけに存在し、変更コストを二重化させる。
                暗黙の結合, Implicit Coupling:  #keyword: Shadow class of __Entity__
                    Shadow Class が孕む本質的な問題は、Entity と Shadow が同じ構造を維持しなければならないという
                    暗黙の不変条件（Structural Invariant）が、コード上のどこにも明示されていない点にある。
                    両クラスは型システム上は独立しているにもかかわらず、実際には片方の変更が必ずもう片方の変更を要求する。
                    このImplicit Coupling こそが、Shadow Class を単なる「重複」以上の問題にしている。
                    この不変条件を明示する手段としては、
                        (1) Shadow class of __Entity__ とコメントを書く
                        (2) 型レベルで構造一致を強制する
                        (3) コード生成で同期を機械化する
                        (4) ドキュメントで契約として記述する
                    などが考えられる。いずれも「人間の注意力に依存した暗黙のルール」を「ツールや型による明示的なルール」に置き換えるアプローチである。
                Parallel Hierarchy / Parallel Class:  #// 構造が並行して存在するクラス群
                Mirror Class:  #// 鏡のように対応するクラス（俗称）
                Anemic Model:  #// ロジックを持たないデータだけのクラス（Fowler）
                Boilerplate:  #// 定型的に繰り返される似たコード一般
            DTO Explosion, Mapping Hell:
