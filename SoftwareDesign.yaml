                        8.4　不適切なライフスタイルの選択:
                            8.4.1　捕らわれた依存関係: #keyword: DI book Captive Dependency  #既読
                                -   生存期間の長さの比較:
                                        singleton > scoped > transient
                                            #// 1つでも transient なオブジェクトがあれば、最も所有親のオブジェクトは transient である必要があります
                                -   SqlProductRepository (singleton：親) --- CommerceContext（transient：子） の場合、
                                        CommerceContext は、ガーベージコレクターの回収対象になりません（捕らわれている）
                                -   対策:
