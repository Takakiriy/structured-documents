            Camel ケースの利点: |  #// JSON style
                API レスポンスの値と一致させやすい
                    const user: { status: Status } = await fetchUser();
                JSON が JavaScript から生まれたため、JavaScript の慣習（camelCase）が自然に持ち込まれました。（定数だが受け入れられた）
                実績としては、VSCode の launch.json の "console": "integratedTerminal" など
            TypeScript:
                union type: | #// Camel ケース  #search: TypeScript union type
                    // 定数インスタンスの定義
                    const statusMap = {
                        active:   'アクティブ',
                        inactive: '非アクティブ',
                        pending:  '保留中',
                    } as const;

                    // 文字列の Union 型の定義。 定数インスタンスのキーの型
                    type Status = keyof typeof statusMap; // 'active' | 'inactive' | 'pending'

                    var  status: Status = 'active';
                enum: | #// 大文字のスネークケース。ただし、enum も非推奨になりつつある
                    enum EvidenceTypeEnum {
                        UNKNOWN = '',
                        PASSPORT_VISA = 'passport_visa',
                        PASSPORT = 'passport',
                        SIGHTED_STUDENT_CARD = 'sighted_tertiary_edu_id',
                    }

                    EvidenceTypeEnum.PASSPORT_VISA
            C言語:
                _:
                    C の時代は「定数かどうか」が言語機能として保証されていなかったので、命名で区別する必要がありました。
                    それが Java → JavaScript → TypeScript と引き継がれてきた慣習です。
                    TypeScript では const や as const が型レベルで不変性を保証するので、命名で強調する意味は薄いです。
                サンプル: |
                    #define MAX_SIZE 100  // プリプロセッサで置換される「本物の定数」
                    int maxSize = 100;    // 変数（再代入できる）
                スコープ派: |
                    const MAX_RETRY_COUNT = 3;  // グローバルな設定値という意図を示したい
                    function fetchData() {
                        const retryCount = 0;   // ローカルな変数
                    }
                    トップレベルに置くグローバルな設定値とローカルな変数を区別したいというが、関数も定数である。
