構成のバージョンアップ:  #keyword: version upgrade debug,  バージョン管理
    基本方針:
        方針: バージョンは最新にするのをデフォルトとするが、テストに失敗したときは戻せるようにするのがベストプラクティス。
        手順:
            更新方法の方針, 古いバージョンの扱い:
                - テストをアプリ側に用意して破壊的変更に追従できるようにする
                - 中間リポジトリを本番環境用バージョンとは別に用意する  #search: staging repository
                - 古いまま修正が当たる長期サポートのディストリビューションやパッケージを使う
                - どうしても追従できない部分はコンテナで隔離して被害範囲を絞る。
                    脆弱性を突かれたとき、ホスト全体が攻撃されるのを防ぎます。
                    たとえば「古い Python でしか動かないアプリ」があるなら、そのアプリと古い Python をコンテナーに入れます。
                    ホスト OS は最新に更新します
                - 固定は期限付きの時間稼ぎとして使い、放置しない。セキュリティ修正が当たっていないなど問題があるため
                    本当に固定が必要な場面（再現性のための検証環境など）以外では最新を使うことをおすすめします。
            ステージング リポジトリ（ミラー）: #keyword: staging repository
                ステージング:  #// staging repository
                    「本番を止める警報」ではなく「ステージングで鳴る警報」にする。
                    新バージョンはまず中間リポジトリには入れず、検証用の経路にだけ流す。
                    検証を通ったバージョンだけを中間リポジトリに「昇格」させ、本番はそこからしか取らない。
                    ステージングが参照する「最新受信用リポジトリ」と、本番が参照する「承認済みリポジトリ」に分けます。
                    reposync で同期するが、デフォルトで外部に合わせて古い RPM を削除しがち。（よくない）
                プロダクト:  #// product repository
                    本番は承認済みリポジトリを使います
                    staging repository を使ったテストと product repository を使ったテストの両方を実行します
                versionlock.list, RPM_versions.lock:  #search: versionlock.list
                    バージョン番号が保存してあるファイル
                    リポジトリに通常ファイルとして入れておきます
                    旧バージョンを（本番用・承認済みリポジトリから）インストールするときに参照します
                段階的本番リリース:
                    全台一斉ではなく段階的にします。
                    適用前に必ず戻せる状態を用意しておく。
                    本番だけでなくステージングでもテストするほうがよい。
                スクリプト:
                    インストーラー（最新・固定）:  #ref: ${GitHub}/MyPrivateCode/bash/RPM_version_lock/install-packages.sh
