    SBOM: #keyword:  #// Software Bill Of Materials．ソフトウェア部品表
        概要: ソフトウェアコンポーネント、ライセンス、依存関係の一覧の書式の１つ。
            到達経路や範囲もあるとよい（SBOM ではないと思うが）
        応用:
