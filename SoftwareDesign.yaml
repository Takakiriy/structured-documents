                コメントの前:
                    2つの空白  #ref: https://google.github.io/styleguide/pyguide.html
                タイポグラフィ:
                    伝統的な手法です
                    文章でも、単語間は1スペース、文と文の間は2スペース（またはピリオド後の大きめのスペース）を使う慣習があります
