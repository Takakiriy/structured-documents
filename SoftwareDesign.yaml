                        1.5　まとめ:
                            - （意見）密結合がスパゲティコード！？ p40
                            - p41
                                ●依存注入 （Dependency Injection:DI）はソフトウェア設計の原則やパターンを集めたものであり、それらの原則やパターンはオブジェクト間の関係が疎結合になることを促すようになっている。そして、そのような疎結合を実現すると、コードに対する保守容易性が向上することになる。
                                ●コードベースの基盤が疎結合になっていると、そのコードベースは誰からも使われ、アプリケーションのコードやその基盤に対して変化する必要性や予期していない要求に対して、既存のコードへの大きな変更を必要とすることなく、応えられるようになる。
                                ●疎結合なコードベースであれば、問題の対応をより負担なく行えるようになる。なぜなら、問題の原因となる箇所が存在するであるう範囲を限定しやすくなるからである。
                                ●依存注入を導入すると遅延バインディング （late binding）が可能になる。そうすると、元のコードを再度コンパイルすることなく、クラスやモジュールを別のものに置き換えられるようになる。
                                ●依存注入を導入することで、家電製品のプラグをコンセントに繋げるような柔軟性を持てるようになる。そのため、設計時には想定していなかったコードの拡張や再利用がより簡単に行えるようになる。
                                ●依存注入を導入することで、同じコードベース上で異なる開発者が並列に開発することが行いやすくなる。このようになる理由は、各関心事に対して異なる依存を用意することで、関心の分離を実現しやすくなり、その結果、各開発チームや開発チームの開発者が自身の担当する機能を他の機能から隔離された状況で開発できるようになるからである。
                                ●依存注入を導入することで、テスト容易性が向上する。このようになる理由は、単体テストを作成する際、依存をテスト用の実装（モックなどのテスト・ダブル）に置き換えられるようになるからである。
                            - p42
                                ●依存注入を実際に導入する際、サービスを必要とするクラスは必要とされるサービスを提供するように基盤に尋ねるべきである。このことはクラスが依存するものを具象クラスではなく抽象にすることで行えるようになる。
                                ●依存を利用とするクラスは自身が必要とする依存を外部に自身で問い合わせて取得すべきではない
                                （これはサービス・ロケータと呼ばれるアンチ・パターンである）。そうではなく、依存を必要とするクラスは自身が必要とする依存をコンストラクタの引数を用いて静的に提示するようにする。このプラクティスはコンストラクタ経由での注入（Constructor Injection）と呼ばれる。
                                ●開発者の中には、依存注入を行うのに専用のツール（いわゆるDIコンテナ）が必要であると考えている人が多いが、これは誤解である。確かに、DIコンテナを用いることは有用だが、必ずしも必要となるわけではない。
                                ●依存注入を可能にする上で、ソフトウェアの設計に関する原則の中で特に重要となるのは、リスコフの置換原則 （Liskov Substitution Principle）である。この原則が提唱していることは、インターフェイスの実装クラスを別の実装クラスに置き換えても、そのインターフェイスを呼び出しているコードや実装クラスに破壊的な変更を加えなくても済むようにすることである。
                                ●依存が安定依存（stable dependency）になるのは、その依存が最初から存在するものであり、決定的な振る舞いを行い、実行環境の設定（たとえば、リレーショナル・データベースの設置など）を必要とせず、置き換えられたり、装飾（decoration）されたり、介入（interception）されたりする必要がないようになっている場合である。
                                ●依存が揮発性依存（volatile dependency）になるのは、その依存が開発中であったり、すべての開発環境に常に備わっていなかったり、非決定的な振る舞いを行うようになっていたり、置き換えられたり、内包されたり、介入されたりする必要があるようになっている場合である。
                                ●揮発性依存は依存注入を導入する際に目を向けなくてはならないものである。なぜなら、コンストラクタ経由でクラスに注入する依存は揮発性依存だからである。
                                ●依存に対する制をその依存が注入されるクラスから取り除き、その制をアプリケーションのエントリ・ポイントに移すことで、より簡単に横断的関心事（cross-cutting concern）への適応が行えるようになり、依存の生存管理をより効率的に行えるようになる。
                                ●開発を成功させるためには、依存注入を広範囲に適用できるようにしなければならない。そのためには、最初から、すべてのクラス はコンストラクタ経由での注入を介して必要な発性依存を取得できるようにすべきである。なぜなら、既存のコードに対して疎結合や依存注入をあとで導入することは難しいからである。
