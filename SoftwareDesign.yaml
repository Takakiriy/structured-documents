        三項演算子は本当に読みにくいのか:  #ref: https://qiita.com/Takakiri/items/be93a6fb84bd78846749
        連続した三項演算子: |
            false ? 1 :
            true ? 2 :
            3
        PHP 8.0 での仕様変更:
            サンプル: |
                true ? 'true' : false ? 't' : 'f'
            PHP 8.0以降: |  #// 1つ目の : より 2つ目の ? のほうが結合が強いです。 2つ目の ? : は、1つ目が真なら評価されず、偽なら後で結合した式が評価されます
                true ? 'true' : false ? 't' : 'f'
                    ↓
                true ? 'true' : ( false ? 't' : 'f' )
                    ↓
                'true'
            PHP 7.x以前: |  #// 2つ目の ? は結合が弱いですが、後で評価されます
                true ? 'true' : false ? 't' : 'f'
                    ↓
                ( true ? 'true' : false ) ? 't' : 'f'
                    ↓
                ( 'true' ) ? 't' : 'f'
                    ↓
                't'
