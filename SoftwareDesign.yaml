    クリーン アーキテクチャー: #keyword: The Clean Architecture, CA, Robert C. Martin. Uncle Bob
        概要:
            ビジネス ロジック を中心に書き、インフラの実装に依存させないインターフェースを挟む
            クリーンとは、依存関係、ビジネス ロジック、関心事 が重要でないもの（技術的な詳細）に汚されていない状態
            問題点も多い
        クリーンアーキテクチャは変更コストが高い！ YAGNI原則を適用して軽量化する:  #ref: https://qiita.com/Takakiri/items/a2793bd22754e44b76e1
        構成, 依存関係ルール, The Dependency Rule:  #keyword: clean architecture dependency rule
            （最重要ルール）: 外側→内側の依存関係ルール。内側の円にあるものは、外側の円にあるものについて一切知ることはできません。
            中心, Enterprise Business Rule:  #// 他の構成要素に依存しない（import しない）
                Entities:
            その外1, Application Business Rule:
