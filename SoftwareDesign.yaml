                        12.1　DIコンテナの紹介:
                            _:
                                DIコンテナの機能は、合成、介入（注入）、生存管理など p443  singleton 生存戦略 life style p465
                            12.1.1　コンテナのResolve APIを探索する:
                                var controller = (HomeController)container.Resolve(typeof(HomeController)); p444
                                抽象とその実装クラスの紐付けは事前にDIコンテナに登録されていなければならない。例外になる p445
                            12.1.2　自動解決（Auto-Wiring）:
                                （自動解決のフローチャート） p447
                                （異なる Register メソッドでは）デリゲート（コールバック）を直接呼び出してオブジェクトを生成できるようになります p450
                            12.1.3　例：自動解決をサポートするシンプルなDIコンテナの実装:
                                -   純粋な依存注入の場合、使用する実装クラスのコンストラクタに何らかの変更があった場合、
                                    その変更を合成基点のコードにも反映しなくてはならない p456
                                -   DIコンテナは（プロセスを停止させることなく）循環依存を見つけ出せる p457
                                -   コードが悪い理由
                                    1. 介入（Interception）機能がない
                                        ログ記録、トランザクション管理、キャッシュなどの横断的関心事をオブジェクト生成時に差し込む仕組みがありません。
                                    2. 生存管理（Lifetime Management）がない
                                        シングルトン、トランジェント、スコープといった生存戦略（3枚目のAddSingleton/AddTransient/AddScopedに相当）の概念がなく、毎回CreateNewで新しいオブジェクトを生成するだけです。
                                    3. 本番品質の検証がない
                                        循環依存の検出、登録漏れの早期エラー、スレッドセーフティなどが考慮されていません。
