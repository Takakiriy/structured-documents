        バルク化: #keyword: バルク化, バルク処理, バッチ処理
            _: 複数のデータベース操作を一度に実行することで、個別に各クエリを実行するよりも効率的に処理を行う方法。
            有効なケース:
                - サーバーが遠いとき（レイテンシが長いとき）
                - API 呼び出しが完了したら消えるキャッシュがあるとき
