                                実装方法:  #// 大きく分けると、グラフに直接埋め込む方式と、Factory経由でグラフ外に置く方式の2つがあります。
                                    方式A：グラフ構築時に生成して、グラフに直接埋め込む:
                                        短命オブジェクトをグラフ構築の最中に new し、コンストラクタ経由で注入してグラフのノードにする方式です。
                                        これが8.3.2項（添付資料）が扱っている方式です。生成タイミングは「そのオブジェクト・グラフが構築される瞬間」です。
                                        この方式は、グラフ内でその依存を要求する箇所が何か所あるかによって、結果が2通りに分かれます。
                                        要求箇所が1つだけの場合は、生成されるインスタンスも1個になります。
                                        このとき、生成個数や同一性といった観測可能な振る舞いの上ではスコープドと見分けがつきません。（PureDIの場合）🌟
                                        資料も、各依存に対して1つのクラスしかその依存を使わない場合は、短命で構築してもスコープドや
                                        シングルトンで構築したものと同等になる、と述べています（グラフが一度しか取得されないため違いが見分けられない）。
                                        要求箇所が複数ある場合は、その数だけインスタンスが生成されます。リスト8.11で ProductService と
                                         SqlUserRepository がそれぞれ別の AspNetUserContextAdapter を受け取るのがこれです。
                                         スコープドなら同一インスタンスを共有するので、ここで初めて両者の差が観測されます。
                                        重要なのは、この2つは別々の戦略ではなく、同一の短命戦略が、要求箇所の数に応じて見せる2つの結果だという点です。
                                        しくみ（グラフ構築時に埋め込む）は同じです。
                                    方式B：Factoryをグラフに入れ、利用時に都度生成する:
                                        短命オブジェクトそのものはグラフに載せず、代わりに Factory（ChannelFactory<TChannel> 
                                        や Func<T> など）をグラフに埋め込んでおく方式です。実際の短命オブジェクトは、
                                        利用側のクラスが Factory を呼んだ瞬間（メソッド実行のたび、ループの各回など）に生成されます。
                                        生成タイミングが「グラフ構築時」ではなく「利用時（オンデマンド）」に移るのが、方式Aとの本質的な違いです。
                                        この方式は、別会話「破棄可能な依存の扱い方」で扱われていた内容に対応します。
                                        IDisposable を実装した短命オブジェクト（WCFプロキシのチャネルなど）を、使い終わったらすぐ
                                         Dispose する必要がある場合に用いられます。グラフに載るのは長命な Factory のほうで、
                                         破棄可能なチャネル本体はグラフに載らず、リポジトリ実装がメソッド内で生成・使用・即破棄します。
                                         これにより、破棄可能な依存が利用クラスへ漏れ出すのを防ぎ、生存期間をメソッド内に閉じ込められます。
                                        2つの方式の使い分け
                                        方式Aは、破棄が不要、あるいは生存期間が問題にならない短命オブジェクトに用います。
                                        方式Bは、IDisposable で確実な即破棄が必要な短命オブジェクト、
                                        あるいはグラフの寿命より細かい単位で都度新しいインスタンスが欲しい場合に用います。
                                        この2つは、同じ「短命オブジェクト」を扱いながら、添付資料（8.3.2項）が方式Aを、
                                        別会話の破棄可能な依存の項が方式Bを担当する、という形で補い合う関係になっています。
                                    全体像のまとめ:
                                        短命オブジェクトの扱いは、グラフへの載せ方で次のように整理できます。
                                        グラフに直接埋め込む方式（方式A）では、グラフ構築時に生成され、
                                        その依存の要求箇所が1つならスコープドと見分けがつかず、複数あればその数だけ生成されてスコープドと差が出ます。
                                        一方、Factory経由の方式（方式B）では、グラフに載るのはFactoryのみで、
                                        短命オブジェクト本体はグラフに載らず、利用側がFactoryを呼んだ瞬間に生成され、
                                        破棄可能な場合はその場で破棄されます。
                            8.3.3　スコープド ライフ スタイル, スコープ指定: #keyword: DI book scoped  #// リクエストのたびに、新しいインスタンスが常に 1つ提供される
                                -   スコープが具体的に何であるかは定義していません。 スコープに相当する何かという抽象的な定義です
                                -   スコープの例: リクエスト
                                        リクエストに並列で応答する Web アプリケーションは、スコープド ライフ スタイル が適する。 p322
                                        第13章 Autofac の「13.2 Managing lifetime / 13.2.1 Configuring instance scopes」 O'Reilly
                                        第14章 Simple Injector の「14.2 Managing lifetime / 14.2.1 Configuring Lifestyles / 14.2.3 Ambient scopes」 O'Reilly
                                        そして Microsoft.Extensions.DependencyInjection を扱う章(第15章相当)
                                -   スレッド セーフ でないオブジェクトにも適用できます。DbContext など p322
