<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステージングとプロダクトのリポジトリ構成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Iosevka&display=swap" rel="stylesheet">
<style>
.page {
    margin: 0;
    padding: 24px 16px;
    background: #f6f5f0;
    color: #232320;
    font-family: "BIZ UDGothic", Arial, sans-serif;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.8;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
}
.title {
    font-size: 1.9rem;
    font-weight: 700;
    margin: 8px 0 8px;
}
.lead {
    font-size: 1rem;
    font-weight: 400;
    color: #4c4b45;
    margin: 0 0 32px;
}
.section {
    margin: 0 0 44px;
}
.heading {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 14px;
    border-left: 6px solid #2f7d63;
    padding-left: 12px;
}
.note {
    font-size: 1rem;
    font-weight: 400;
    margin: 14px 0 0;
}
.shrink-wide {
    width: 100%;
    overflow-x: auto;
}
.shrink-wide-inner {
    width: 300%;
    max-width: 1400px;
}
.figure {
    width: 100%;
    height: auto;
    display: block;
    background: #ffffff;
    border: 2px solid #d8d5c9;
    border-radius: 14px;
}
.tlabel { fill: #232320; font-size: 15px; font-weight: 700; font-family: "BIZ UDGothic", Arial, sans-serif; }
.tsub { fill: #4c4b45; font-size: 13px; font-weight: 400; font-family: "BIZ UDGothic", Arial, sans-serif; }
.tnote { fill: #4c4b45; font-size: 13px; font-weight: 400; font-family: "BIZ UDGothic", Arial, sans-serif; }
</style>
</head>
<body class="page">

<div class="title">ステージングとプロダクトのリポジトリ構成</div>
<div class="lead">インターネット上のパッケージをローカルのステージングリポジトリへ取り込み、検証を通ったものだけを社内GitHubのプロダクトリポジトリへ昇格させ、それぞれのリポジトリからVMを構成する流れです。</div>

<div class="section">
<div class="heading">全体の流れ</div>
<div class="shrink-wide">
<svg class="figure shrink-wide-inner" viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>インターネットからステージング、承認を経て社内GitHubのプロダクトリポジトリへ、それぞれからVMを構成する全体図</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4c4b45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="20" y="30" width="190" height="70" rx="12" fill="#d9ecff" stroke="#114a7a" stroke-width="1.5"/>
<text class="tlabel" x="115" y="60" text-anchor="middle">インターネット</text>
<text class="tsub" x="115" y="80" text-anchor="middle">外部リポジトリ</text>

<line x1="210" y1="65" x2="280" y2="65" stroke="#4c4b45" stroke-width="1.6" marker-end="url(#arrow)"/>
<text class="tnote" x="245" y="53" text-anchor="middle">取得</text>

<rect x="280" y="30" width="210" height="70" rx="12" fill="#d7f0e6" stroke="#12543f" stroke-width="1.5"/>
<text class="tlabel" x="385" y="60" text-anchor="middle">staging repository</text>
<text class="tsub" x="385" y="80" text-anchor="middle">ローカル（検証用）</text>

<line x1="385" y1="100" x2="385" y2="150" stroke="#4c4b45" stroke-width="1.6" marker-end="url(#arrow)"/>
<text class="tnote" x="440" y="128" text-anchor="middle">承認</text>

<rect x="280" y="150" width="210" height="70" rx="12" fill="#fbe6c8" stroke="#7a4a0c" stroke-width="1.5"/>
<text class="tlabel" x="385" y="180" text-anchor="middle">product repository</text>
<text class="tsub" x="385" y="200" text-anchor="middle">社内GitHub</text>

<line x1="490" y1="65" x2="620" y2="65" stroke="#4c4b45" stroke-width="1.6" marker-end="url(#arrow)"/>
<text class="tnote" x="555" y="53" text-anchor="middle">参照</text>

<line x1="490" y1="185" x2="620" y2="185" stroke="#4c4b45" stroke-width="1.6" marker-end="url(#arrow)"/>
<text class="tnote" x="555" y="173" text-anchor="middle">参照</text>

<rect x="620" y="18" width="320" height="90" rx="12" fill="#ece7fb" stroke="#4a2f8a" stroke-width="1.5"/>
<text class="tlabel" x="780" y="46" text-anchor="middle">VM（staging構成）</text>
<text class="tsub" x="780" y="66" text-anchor="middle">staging repository を参照して構成</text>
<text class="tsub" x="780" y="86" text-anchor="middle">承認前の検証環境</text>

<rect x="620" y="138" width="320" height="90" rx="12" fill="#ece7fb" stroke="#4a2f8a" stroke-width="1.5"/>
<text class="tlabel" x="780" y="166" text-anchor="middle">VM（product構成）</text>
<text class="tsub" x="780" y="186" text-anchor="middle">product repository を参照して構成</text>
<text class="tsub" x="780" y="206" text-anchor="middle">本番相当の環境</text>

<text class="tnote" x="480" y="300" text-anchor="middle">検証はstaging構成のVMで行い、通ったものだけをproduct repositoryへ昇格する</text>
</svg>
</div>
<div class="note">左からインターネット、ステージング、承認後のプロダクトという流れで、それぞれのリポジトリを参照するVMを右側にまとめています。上がステージング構成のVM、下がプロダクト構成のVMです。</div>
</div>

</body>
</html>
