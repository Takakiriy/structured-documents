<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Hooks タイミング一覧</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 32px 24px 48px;
  }

  .page-title {
    font-size: 28px;
    font-weight: 700;
    color: #111;
    margin-bottom: 8px;
  }

  .page-sub {
    font-size: 15px;
    color: #555;
    margin-bottom: 32px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* --- section heading labels --- */
  .sec-label {
    font: 700 20px/1 system-ui, sans-serif;
    fill: #111;
  }

  .sec-line {
    stroke: #ccc;
    stroke-width: 1;
  }

  /* --- node boxes --- */
  .node-box {
    cursor: default;
  }

  /* can-stop: purple */
  .can-stop rect   { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1.5; rx: 10; }
  .can-stop .ntitle { font: 700 17px/1 system-ui, sans-serif; fill: #3C3489; }
  .can-stop .nsub   { font: 400 14px/1 system-ui, sans-serif; fill: #534AB7; }

  /* notify: teal */
  .notify rect   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1.5; }
  .notify .ntitle { font: 700 17px/1 system-ui, sans-serif; fill: #085041; }
  .notify .nsub   { font: 400 14px/1 system-ui, sans-serif; fill: #0F6E56; }

  /* server: blue */
  .server rect   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1.5; }
  .server .ntitle { font: 700 17px/1 system-ui, sans-serif; fill: #0C447C; }
  .server .nsub   { font: 400 14px/1 system-ui, sans-serif; fill: #185FA5; }

  /* misc: gray */
  .misc rect   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1.5; }
  .misc .ntitle { font: 700 17px/1 system-ui, sans-serif; fill: #2C2C2A; }
  .misc .nsub   { font: 400 14px/1 system-ui, sans-serif; fill: #5F5E5A; }

  /* amber */
  .amber rect   { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1.5; }
  .amber .ntitle { font: 700 17px/1 system-ui, sans-serif; fill: #412402; }
  .amber .nsub   { font: 400 14px/1 system-ui, sans-serif; fill: #854F0B; }

  /* --- arrows --- */
  .arr {
    stroke: #888;
    stroke-width: 2;
    fill: none;
  }

  /* --- legend --- */
  .leg-label {
    font: 400 15px/1 system-ui, sans-serif;
    fill: #333;
  }

  /* --- side note --- */
  .sidenote {
    font: 400 13px/1 system-ui, sans-serif;
    fill: #777;
  }

  /* --- divider between client/server --- */
  .divider {
    stroke: #bbb;
    stroke-width: 1;
    stroke-dasharray: 6 4;
  }
</style>
</head>
<body>

<p class="page-title">Git Hooks — タイミング一覧</p>
<p class="page-sub">各操作でフックが発火する順番。紫 = コミットを中断できる　緑 = 通知のみ　青 = サーバー側　黄 = rebase 系　灰 = 補助</p>

<svg viewBox="0 0 1000 1060" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ============================================================
     SECTION: COMMIT
     ============================================================ -->
<text class="sec-label" x="20" y="38">Commit</text>
<line class="sec-line" x1="20" y1="46" x2="980" y2="46"/>

<!-- pre-commit -->
<g class="node-box can-stop">
  <rect x="20" y="60" width="200" height="64" rx="10"/>
  <text class="ntitle" x="120" y="88" text-anchor="middle" dominant-baseline="central">pre-commit</text>
  <text class="nsub"   x="120" y="110" text-anchor="middle" dominant-baseline="central">コミット前・ステージ確認</text>
</g>

<line class="arr" x1="220" y1="92" x2="254" y2="92" marker-end="url(#ah)"/>

<!-- prepare-commit-msg -->
<g class="node-box can-stop">
  <rect x="256" y="60" width="240" height="64" rx="10"/>
  <text class="ntitle" x="376" y="88" text-anchor="middle" dominant-baseline="central">prepare-commit-msg</text>
  <text class="nsub"   x="376" y="110" text-anchor="middle" dominant-baseline="central">エディタ起動前</text>
</g>

<line class="arr" x1="496" y1="92" x2="530" y2="92" marker-end="url(#ah)"/>

<!-- commit-msg -->
<g class="node-box can-stop">
  <rect x="532" y="60" width="200" height="64" rx="10"/>
  <text class="ntitle" x="632" y="88" text-anchor="middle" dominant-baseline="central">commit-msg</text>
  <text class="nsub"   x="632" y="110" text-anchor="middle" dominant-baseline="central">メッセージ検証</text>
</g>

<!-- commit-msg → post-commit (down) -->
<line class="arr" x1="632" y1="124" x2="632" y2="152" marker-end="url(#ah)"/>

<!-- post-commit -->
<g class="node-box notify">
  <rect x="532" y="154" width="200" height="64" rx="10"/>
  <text class="ntitle" x="632" y="182" text-anchor="middle" dominant-baseline="central">post-commit</text>
  <text class="nsub"   x="632" y="204" text-anchor="middle" dominant-baseline="central">コミット完了後・通知</text>
</g>

<!-- ============================================================
     SECTION: MERGE
     ============================================================ -->
<text class="sec-label" x="20" y="266">Merge</text>
<line class="sec-line" x1="20" y1="274" x2="980" y2="274"/>

<!-- pre-merge-commit -->
<g class="node-box can-stop">
  <rect x="20" y="288" width="240" height="64" rx="10"/>
  <text class="ntitle" x="140" y="316" text-anchor="middle" dominant-baseline="central">pre-merge-commit</text>
  <text class="nsub"   x="140" y="338" text-anchor="middle" dominant-baseline="central">マージコミット前</text>
</g>

<line class="arr" x1="260" y1="320" x2="294" y2="320" marker-end="url(#ah)"/>

<!-- post-merge -->
<g class="node-box notify">
  <rect x="296" y="288" width="200" height="64" rx="10"/>
  <text class="ntitle" x="396" y="316" text-anchor="middle" dominant-baseline="central">post-merge</text>
  <text class="nsub"   x="396" y="338" text-anchor="middle" dominant-baseline="central">マージ完了後・通知</text>
</g>

<!-- ============================================================
     SECTION: PUSH
     ============================================================ -->
<text class="sec-label" x="20" y="400">Push</text>
<line class="sec-line" x1="20" y1="408" x2="980" y2="408"/>

<!-- client / server divider -->
<line class="divider" x1="20" y1="540" x2="980" y2="540"/>
<text class="sidenote" x="20"  y="534">← クライアント側</text>
<text class="sidenote" x="340" y="534">← サーバー側 →</text>

<!-- pre-push -->
<g class="node-box can-stop">
  <rect x="20" y="422" width="180" height="64" rx="10"/>
  <text class="ntitle" x="110" y="450" text-anchor="middle" dominant-baseline="central">pre-push</text>
  <text class="nsub"   x="110" y="472" text-anchor="middle" dominant-baseline="central">push 実行前</text>
</g>

<line class="arr" x1="200" y1="454" x2="234" y2="454" marker-end="url(#ah)"/>

<!-- pre-receive -->
<g class="node-box server">
  <rect x="236" y="422" width="200" height="64" rx="10"/>
  <text class="ntitle" x="336" y="450" text-anchor="middle" dominant-baseline="central">pre-receive</text>
  <text class="nsub"   x="336" y="472" text-anchor="middle" dominant-baseline="central">サーバー受信前</text>
</g>

<line class="arr" x1="436" y1="454" x2="470" y2="454" marker-end="url(#ah)"/>

<!-- update -->
<g class="node-box server">
  <rect x="472" y="422" width="180" height="64" rx="10"/>
  <text class="ntitle" x="562" y="450" text-anchor="middle" dominant-baseline="central">update</text>
  <text class="nsub"   x="562" y="472" text-anchor="middle" dominant-baseline="central">ref 1本ずつ更新前</text>
</g>

<line class="arr" x1="652" y1="454" x2="686" y2="454" marker-end="url(#ah)"/>

<!-- post-receive -->
<g class="node-box notify">
  <rect x="688" y="422" width="200" height="64" rx="10"/>
  <text class="ntitle" x="788" y="450" text-anchor="middle" dominant-baseline="central">post-receive</text>
  <text class="nsub"   x="788" y="472" text-anchor="middle" dominant-baseline="central">受信完了後・通知</text>
</g>

<!-- post-update (below post-receive) -->
<line class="arr" x1="788" y1="486" x2="788" y2="548" marker-end="url(#ah)"/>

<g class="node-box notify">
  <rect x="688" y="550" width="200" height="64" rx="10"/>
  <text class="ntitle" x="788" y="578" text-anchor="middle" dominant-baseline="central">post-update</text>
  <text class="nsub"   x="788" y="600" text-anchor="middle" dominant-baseline="central">ref 更新後・補助通知</text>
</g>

<!-- ============================================================
     SECTION: REBASE / AM
     ============================================================ -->
<text class="sec-label" x="20" y="660">Rebase / Cherry-pick / git am</text>
<line class="sec-line" x1="20" y1="668" x2="980" y2="668"/>

<!-- pre-rebase -->
<g class="node-box amber">
  <rect x="20" y="682" width="190" height="64" rx="10"/>
  <text class="ntitle" x="115" y="710" text-anchor="middle" dominant-baseline="central">pre-rebase</text>
  <text class="nsub"   x="115" y="732" text-anchor="middle" dominant-baseline="central">rebase 開始前</text>
</g>

<line class="arr" x1="210" y1="714" x2="244" y2="714" marker-end="url(#ah)"/>

<!-- applypatch-msg -->
<g class="node-box amber">
  <rect x="246" y="682" width="220" height="64" rx="10"/>
  <text class="ntitle" x="356" y="710" text-anchor="middle" dominant-baseline="central">applypatch-msg</text>
  <text class="nsub"   x="356" y="732" text-anchor="middle" dominant-baseline="central">パッチメッセージ検証</text>
</g>

<line class="arr" x1="466" y1="714" x2="500" y2="714" marker-end="url(#ah)"/>

<!-- pre-applypatch -->
<g class="node-box amber">
  <rect x="502" y="682" width="210" height="64" rx="10"/>
  <text class="ntitle" x="607" y="710" text-anchor="middle" dominant-baseline="central">pre-applypatch</text>
  <text class="nsub"   x="607" y="732" text-anchor="middle" dominant-baseline="central">パッチ適用前</text>
</g>

<line class="arr" x1="607" y1="746" x2="607" y2="774" marker-end="url(#ah)"/>

<!-- post-applypatch -->
<g class="node-box notify">
  <rect x="502" y="776" width="210" height="64" rx="10"/>
  <text class="ntitle" x="607" y="804" text-anchor="middle" dominant-baseline="central">post-applypatch</text>
  <text class="nsub"   x="607" y="826" text-anchor="middle" dominant-baseline="central">パッチ適用後・通知</text>
</g>

<!-- ============================================================
     SECTION: CHECKOUT / SWITCH
     ============================================================ -->
<text class="sec-label" x="20" y="882">Checkout / Switch</text>
<line class="sec-line" x1="20" y1="890" x2="980" y2="890"/>

<g class="node-box misc">
  <rect x="20" y="904" width="210" height="64" rx="10"/>
  <text class="ntitle" x="125" y="932" text-anchor="middle" dominant-baseline="central">post-checkout</text>
  <text class="nsub"   x="125" y="954" text-anchor="middle" dominant-baseline="central">チェックアウト後</text>
</g>

<text class="sidenote" x="244" y="945">環境セットアップ・依存更新などに利用</text>

<!-- post-rewrite -->
<g class="node-box misc">
  <rect x="490" y="904" width="210" height="64" rx="10"/>
  <text class="ntitle" x="595" y="932" text-anchor="middle" dominant-baseline="central">post-rewrite</text>
  <text class="nsub"   x="595" y="954" text-anchor="middle" dominant-baseline="central">amend / rebase 後</text>
</g>

<!-- ============================================================
     LEGEND
     ============================================================ -->
<rect x="20"  y="1010" width="18" height="18" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="leg-label" x="44"  y="1024">コミットを中断できる</text>

<rect x="240" y="1010" width="18" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="leg-label" x="264" y="1024">通知のみ（中断不可）</text>

<rect x="460" y="1010" width="18" height="18" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="leg-label" x="484" y="1024">サーバー側フック</text>

<rect x="650" y="1010" width="18" height="18" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text class="leg-label" x="674" y="1024">rebase / am 系</text>

</svg>

</body>
</html>
