<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>git 認証ヘルパー体系図</title>
<style>
.page {
  margin: 0;
  padding: 0;
  background: #ffffff;
}
.diagram {
  display: block;
  width: 100%;
  height: auto;
  background: #ffffff;
}
.t {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size: 15px;
  font-weight: 700;
  fill: #1a1a1a;
}
.ts {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size: 12px;
  font-weight: 700;
  fill: #333333;
}
.head {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size: 16px;
  font-weight: 700;
  fill: #1a1a1a;
}
.edge {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size: 13px;
  font-weight: 700;
  fill: #555555;
}
.box-gray { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 1.5; }
.box-blue { fill: #e6f1fb; stroke: #185fa5; stroke-width: 1.5; }
.box-teal { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 1.5; }
.box-amber { fill: #faeeda; stroke: #854f0b; stroke-width: 1.5; }
.box-purple { fill: #eeedfe; stroke: #534ab7; stroke-width: 1.5; }
.box-red { fill: #fcebeb; stroke: #a32d2d; stroke-width: 1.5; }
.tx-gray { fill: #2c2c2a; }
.tx-blue { fill: #042c53; }
.tx-teal { fill: #04342c; }
.tx-amber { fill: #412402; }
.tx-purple { fill: #26215c; }
.tx-red { fill: #501313; }
.tx-blue-sub { fill: #185fa5; }
.tx-teal-sub { fill: #0f6e56; }
.tx-amber-sub { fill: #854f0b; }
.tx-purple-sub { fill: #534ab7; }
.tx-red-sub { fill: #a32d2d; }
.arr { stroke: #444441; stroke-width: 2; fill: none; }
.divider { stroke: #888780; stroke-width: 1; stroke-dasharray: 6 5; }
</style>
</head>
<body class="page">
<svg class="diagram" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img">
  <title>git の認証ヘルパーと設定方法の体系図</title>
  <desc>credential.helper の値が感嘆符の有無で外部コマンド型とシェルコマンド型に分かれ、それぞれ store による平文保存や git-credentials、カスタムスクリプトと secret のトークン読み込みに対応する。設定の書き場所は -c による一時指定とローカル/グローバル設定ファイルの永続化に分かれる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect class="box-gray" x="240" y="20" width="200" height="48" rx="8"/>
  <text class="t tx-gray" x="340" y="44" text-anchor="middle" dominant-baseline="central">credential.helper</text>

  <!-- split lines -->
  <path class="arr" d="M340 68 L340 86 L170 86 L170 108" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 68 L340 86 L510 86 L510 108" marker-end="url(#arrow)"/>
  <text class="edge" x="232" y="82" text-anchor="middle">! なし</text>
  <text class="edge" x="450" y="82" text-anchor="middle">! 始まり</text>

  <!-- Branch A header -->
  <rect class="box-blue" x="40" y="108" width="260" height="60" rx="8"/>
  <text class="t tx-blue" x="170" y="130" text-anchor="middle" dominant-baseline="central">外部コマンド型</text>
  <text class="ts tx-blue-sub" x="170" y="152" text-anchor="middle" dominant-baseline="central">git-credential-&lt;名前&gt;</text>

  <!-- Branch B header -->
  <rect class="box-teal" x="380" y="108" width="260" height="60" rx="8"/>
  <text class="t tx-teal" x="510" y="130" text-anchor="middle" dominant-baseline="central">シェルコマンド型</text>
  <text class="ts tx-teal-sub" x="510" y="152" text-anchor="middle" dominant-baseline="central">! 以降をシェルで実行</text>

  <!-- A child 1 -->
  <path class="arr" d="M170 168 L170 190" marker-end="url(#arrow)"/>
  <rect class="box-blue" x="40" y="190" width="260" height="60" rx="8"/>
  <text class="t tx-blue" x="170" y="212" text-anchor="middle" dominant-baseline="central">store / cache</text>
  <text class="ts tx-blue-sub" x="170" y="234" text-anchor="middle" dominant-baseline="central">同梱の実行ファイル</text>

  <!-- A child 2 -->
  <path class="arr" d="M170 250 L170 272" marker-end="url(#arrow)"/>
  <rect class="box-amber" x="40" y="272" width="260" height="60" rx="8"/>
  <text class="t tx-amber" x="170" y="294" text-anchor="middle" dominant-baseline="central">~/.git-credentials</text>
  <text class="ts tx-amber-sub" x="170" y="316" text-anchor="middle" dominant-baseline="central">store が読む平文データ</text>

  <!-- B child 1 -->
  <path class="arr" d="M510 168 L510 190" marker-end="url(#arrow)"/>
  <rect class="box-teal" x="380" y="190" width="260" height="60" rx="8"/>
  <text class="t tx-teal" x="510" y="212" text-anchor="middle" dominant-baseline="central">!f() { ... }; f</text>
  <text class="ts tx-teal-sub" x="510" y="234" text-anchor="middle" dominant-baseline="central">自作スクリプト断片</text>

  <!-- B child 2 -->
  <path class="arr" d="M510 250 L510 272" marker-end="url(#arrow)"/>
  <rect class="box-teal" x="380" y="272" width="260" height="60" rx="8"/>
  <text class="t tx-teal" x="510" y="294" text-anchor="middle" dominant-baseline="central">~/.secret/gitlab-pat</text>
  <text class="ts tx-teal-sub" x="510" y="316" text-anchor="middle" dominant-baseline="central">cat で都度読み込む</text>

  <!-- Divider: where to write -->
  <line class="divider" x1="40" y1="368" x2="640" y2="368"/>
  <text class="head" x="340" y="394" text-anchor="middle">設定をどこに書くか</text>

  <!-- write options -->
  <rect class="box-purple" x="40" y="412" width="186" height="80" rx="8"/>
  <text class="t tx-purple" x="133" y="436" text-anchor="middle" dominant-baseline="central">-c で一時指定</text>
  <text class="ts tx-purple-sub" x="133" y="458" text-anchor="middle" dominant-baseline="central">その1コマンドのみ</text>
  <text class="ts tx-purple-sub" x="133" y="478" text-anchor="middle" dominant-baseline="central">後続に引き継がない</text>

  <rect class="box-purple" x="247" y="412" width="186" height="80" rx="8"/>
  <text class="t tx-purple" x="340" y="436" text-anchor="middle" dominant-baseline="central">ローカル設定</text>
  <text class="ts tx-purple-sub" x="340" y="458" text-anchor="middle" dominant-baseline="central">.git/config に保存</text>
  <text class="ts tx-purple-sub" x="340" y="478" text-anchor="middle" dominant-baseline="central">後続にも有効</text>

  <rect class="box-purple" x="454" y="412" width="186" height="80" rx="8"/>
  <text class="t tx-purple" x="547" y="436" text-anchor="middle" dominant-baseline="central">グローバル設定</text>
  <text class="ts tx-purple-sub" x="547" y="458" text-anchor="middle" dominant-baseline="central">~/.gitconfig に保存</text>
  <text class="ts tx-purple-sub" x="547" y="478" text-anchor="middle" dominant-baseline="central">全リポジトリで有効</text>

  <!-- Divider: URL embed -->
  <line class="divider" x1="40" y1="524" x2="640" y2="524"/>
  <rect class="box-red" x="40" y="542" width="600" height="66" rx="8"/>
  <text class="t tx-red" x="340" y="566" text-anchor="middle" dominant-baseline="central">別系統: URL にトークン埋め込み</text>
  <text class="ts tx-red-sub" x="340" y="590" text-anchor="middle" dominant-baseline="central">https://oauth2:TOKEN@... を .git/config に平文保存（後続に引き継ぐが懸念あり）</text>
</svg>
</body>
</html>
